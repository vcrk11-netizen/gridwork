["Distinguish between scalars and vectors","Calculate speed, velocity and acceleration","Interpret distance–time and velocity–time graphs","Use v^2^ = u^2^ + 2as","Describe how to measure speed and acceleration in the lab"],
`## Scalars and vectors
A **scalar** has magnitude only (distance, speed, mass, time, energy). A **vector** has magnitude and direction (displacement, velocity, acceleration, force, momentum).
## Speed, velocity and acceleration
**speed = distance ÷ time** (v = s ÷ t), measured in m/s
**acceleration = change in velocity ÷ time** (a = (v − u) ÷ t), measured in m/s^2^
Where u is initial velocity and v is final velocity. A negative acceleration is a deceleration.
For uniform acceleration: **v^2^ = u^2^ + 2as**
!eg A car accelerates from rest to 20 m/s in 8 s. a = (20 − 0) ÷ 8 = 2.5 m/s^2^. Distance over this time: v^2^ = 2as gives 400 = 2 × 2.5 × s so s = 80 m.
Average speed = total distance ÷ total time.
## Distance–time graphs
!fig vt
- The gradient is the speed
- A horizontal line means stationary
- A straight sloping line means constant speed
- A curve getting steeper means accelerating
## Velocity–time graphs
- The gradient is the acceleration
- A horizontal line is constant velocity
- The area under the graph is the distance travelled
- A negative gradient is deceleration
For area problems split the shape into rectangles and triangles. Triangle area = ½ × base × height.
## Free fall
Near the Earth's surface all objects accelerate at about **10 m/s^2^** (g) if air resistance is negligible. A feather and a hammer fall together on the Moon, where there is no air.
## Core practical: acceleration
A trolley rolls down a ramp, passing through a light gate attached to a timer. The data logger calculates speeds at two points. a = (v − u) ÷ t. Repeat at different slopes or masses.
!mistake Don't confuse the gradient and the area. On a velocity–time graph the gradient gives acceleration and the area gives distance.
!tip Show units in every step. Convert km/h to m/s by dividing by 3.6.`,

`## Forces
A force is a push or pull measured in newtons (N). The **resultant force** is the single force that has the same effect as all the forces acting. Forces in the same direction add; forces in opposite directions subtract.
## Newton's three laws
1. An object stays at rest or moves at constant velocity unless a **resultant force** acts on it
2. **F = m × a**
3. When object A exerts a force on B, B exerts an equal and opposite force on A
!eg A 1500 kg car has a resultant force of 3000 N. a = F ÷ m = 3000 ÷ 1500 = 2 m/s^2^.
**Weight = mass × gravitational field strength** (W = mg). On Earth g = 10 N/kg. Mass is in kg and is constant; weight is a force in N and depends on where you are.
## Friction and drag
Friction opposes motion between surfaces. Drag (air or water resistance) increases with speed.
### Terminal velocity
A skydiver speeds up as weight is greater than drag. As speed rises, drag rises until it **equals** weight. The resultant force is now zero, so there is no acceleration and the skydiver falls at constant **terminal velocity**. When the parachute opens, drag suddenly exceeds weight, the skydiver slows down until a new, lower terminal velocity is reached.
## Hooke's law
**Force = spring constant × extension** (F = kx)
The extension is directly proportional to force up to the **limit of proportionality**, shown as a straight line through the origin on a force–extension graph. Beyond it, the spring may be permanently deformed. The gradient is the spring constant k (N/m).
## Stopping distance
**Stopping distance = thinking distance + braking distance**
- Thinking distance increases with speed, tiredness, alcohol, drugs, and distractions
- Braking distance increases with speed, mass, wet or icy roads, and worn brakes or tyres
Doubling the speed roughly quadruples the braking distance, because kinetic energy depends on v^2^.
!tip For terminal velocity, always state that the resultant force is zero, so acceleration is zero, so velocity is constant.
!mistake Weight and mass are not the same. Never write "weight in kg".`,

`## Momentum
**momentum = mass × velocity** (p = mv), in kg m/s. It is a vector.
**Conservation of momentum:** in a closed system, the total momentum before a collision equals the total momentum after.
!eg A 2 kg trolley at 3 m/s hits a stationary 1 kg trolley and they stick together. Before: 2 × 3 = 6 kg m/s. After: (2 + 1) × v = 6 so v = 2 m/s.
In an explosion where objects start stationary, the total momentum after is zero, so they move apart with equal and opposite momentum (a gun recoils).
## Force and momentum
**force = change in momentum ÷ time** (F = (mv − mu) ÷ t)
This is Newton's second law in another form. A longer time of impact means a smaller force. This is why:
- Crumple zones increase the time taken for a car to stop
- Seat belts stretch, airbags inflate and cushion the head
- Cyclists wear helmets with foam that compresses
- Gymnasts land on thick mats and bend their knees
## Moments
The turning effect of a force about a pivot.
**moment = force × perpendicular distance from the pivot** (Nm)
A larger force or a greater distance gives a larger moment.
### Principle of moments
For an object in equilibrium: **total clockwise moment = total anticlockwise moment**.
!eg A seesaw has a 300 N child 2 m left of the pivot. How far from the pivot should a 400 N child sit on the right? 300 × 2 = 400 × d. d = 1.5 m.
Levers and spanners use a long distance to make a larger moment from a small force. The centre of mass is the point where the weight of the object acts. A suspended object comes to rest with its centre of mass directly below the pivot.
!tip For collision questions, write "momentum before = momentum after" first, then substitute numbers. Take one direction as positive.
!mistake The distance for a moment must be the perpendicular distance from the pivot to the line of action of the force.`,

`## Charge, current and potential difference
**Current** is the rate of flow of charge, measured in amperes. **Q = I × t** (coulombs = amps × seconds). **Potential difference** (V) is the energy transferred per unit charge. An ammeter goes in series; a voltmeter goes in parallel.
In metals current is a flow of electrons from negative to positive (conventional current is drawn from positive to negative).
## Resistance
**V = I × R**. Resistance (Ω) is the opposition to current. Resistance of a wire increases with length and decreases with cross-sectional area.
### Core practical: resistance of a wire
Measure the current and potential difference for different lengths of wire. Calculate R = V ÷ I and plot R against length: a straight line through the origin.
## Series and parallel
| | Series | Parallel |
| Current | Same everywhere | Splits between branches; total = sum of branch currents |
| Potential difference | Shared; total = sum | Same across every branch |
| Resistance | R~total~ = R~1~ + R~2~ | R~total~ is less than the smallest resistance |
If one component breaks in series the whole circuit stops; in parallel the other branches keep working, which is why houses use parallel circuits.
For two resistors in parallel: 1/R~T~ = 1/R~1~ + 1/R~2~.
## Characteristics (I–V graphs)
- **Resistor at constant temperature**: straight line through the origin (ohmic)
- **Filament lamp**: curve flattens as the wire heats up, resistance increases
- **Diode**: current flows in one direction only; very high resistance in reverse
- **LDR** (light-dependent resistor): resistance falls as light intensity rises
- **Thermistor (NTC)**: resistance falls as temperature rises
They are used in light-sensing circuits and temperature alarms.
## Power and energy
**P = I × V**; combined with V = IR, P = I^2^R. **Energy = I × V × t** (E = Pt). Power in watts; energy in joules.
!eg A 12 V lamp has a current of 0.5 A. P = 12 × 0.5 = 6 W. In 60 s it transfers 6 × 60 = 360 J.
!tip When two resistors are in parallel, check your answer. It must be less than the smaller resistor.`,

`## AC and DC
**Direct current (d.c.)** flows in one direction (cells and batteries). **Alternating current (a.c.)** repeatedly changes direction (mains: UK 230 V, 50 Hz).
## The three-pin plug
| Wire | Colour | Function |
| Live | Brown | Carries current to the appliance at 230 V |
| Neutral | Blue | Completes the circuit |
| Earth | Green and yellow | Safety wire connected to the metal case |
The **fuse** is in the live wire. If current is too high, the fuse wire melts and breaks the circuit. Choose a fuse slightly above the normal current (e.g. 3 A, 5 A, 13 A). The **earth wire** carries current to the ground if the live wire touches the case, which blows the fuse and prevents electrocution. A **circuit breaker** is a switch that trips and can be reset. Double-insulated appliances have no earth wire.
!tip Fuse rating: find the current with I = P ÷ V, then pick the next fuse value above it. A 2300 W kettle draws 10 A, so a 13 A fuse is used.
## Electrical dangers
Damaged insulation, long extension leads, overloaded sockets, water near electrics. Switches and fuses must be in the live wire so that the appliance is not live when off.
## Static electricity
Insulators can be charged by friction. Electrons are transferred: the material that loses electrons becomes positive and the one that gains them becomes negative. Only electrons move; protons are fixed in nuclei.
- **Like charges repel and unlike charges attract**
- A charged object attracts small neutral objects (charged balloon sticks to a wall) by **induction**
- Charge leaks away from a conductor to earth; insulators hold charge
### Uses
- Photocopiers and laser printers use charged drums
- Electrostatic paint spraying gives an even coat
- Smoke precipitators remove dust from chimneys
### Dangers
- Sparks when refuelling aircraft or lorries, so they are earthed first
- Lightning
- Electric shocks from clothing
!mistake A positively charged object has lost electrons. It hasn't gained protons.`,

T("phys","p6","3","Properties of waves","Transverse and longitudinal waves, wave equations, reflection, refraction and diffraction.",3,

`## Types of wave
Waves transfer energy without transferring matter.
- **Transverse**: oscillations are at right angles to the direction of travel. Examples: light, all electromagnetic waves, water ripples.
- **Longitudinal**: oscillations are parallel to the direction of travel, with compressions and rarefactions. Examples: sound, seismic P-waves.
## Wave terms
!fig wave
- **Amplitude**: maximum displacement from the rest position
- **Wavelength (λ)**: distance between the same point on two adjacent waves, in metres
- **Frequency (f)**: number of waves passing a point per second, in hertz
- **Period (T)**: time for one complete wave. **T = 1 ÷ f**
## Wave equations
**wave speed (m/s) = frequency (Hz) × wavelength (m)**, v = fλ
**speed = distance ÷ time**
!eg A wave has frequency 50 Hz and wavelength 0.4 m. v = 50 × 0.4 = 20 m/s.
## Wave behaviours
- **Reflection**: the angle of incidence equals the angle of reflection (measured from the normal)
- **Refraction**: waves change direction when they change speed on entering a different medium. Moving into a slower medium (e.g. air to glass, deep to shallow water), the wavelength decreases and the wave bends towards the normal. Frequency stays the same.
- **Diffraction**: waves spread out as they pass through a gap or round an obstacle. The effect is greatest when the gap is about the same size as the wavelength.
## Core practical: waves in a ripple tank
Measure wavelength with a ruler against the image of the waves, and frequency by counting waves with a stroboscope. Calculate v = fλ and compare with the speed measured using distance ÷ time.
## Sound
Sound is a longitudinal wave. It needs a medium and cannot travel through a vacuum. Frequency is pitch, and amplitude is loudness. Humans hear 20 Hz to 20 000 Hz. Sound travels faster in solids than liquids than gases. Speed in air is about 340 m/s.
!tip Measure wavelength across several waves and divide, to reduce error.`,

`## The spectrum
All electromagnetic waves are **transverse**, transfer energy, and travel at **3 × 10^8^ m/s** in a vacuum. In order of increasing frequency (and decreasing wavelength):
**Radio → microwaves → infrared → visible → ultraviolet → X-rays → gamma rays**
Remember: Red Monkeys In Venice Use X-ray Glasses (the visible band is red to violet).
| Type | Uses | Dangers |
| Radio waves | Broadcasting, communications, Bluetooth | |
| Microwaves | Cooking, satellite communication, mobile phones | Internal heating of body tissue |
| Infrared | Remote controls, thermal imaging, toasters, optical fibres | Skin burns |
| Visible light | Vision, photography, optical fibres | Damage to eyes from lasers |
| Ultraviolet | Sterilising water, security marking, fluorescent lamps | Skin cancer, eye damage |
| X-rays | Medical imaging, airport security | Cell damage and cancer |
| Gamma rays | Sterilising food and equipment, treating cancer | Cell damage and cancer |
**Ionising radiation** (UV, X-rays and gamma rays) has enough energy to remove electrons from atoms and can cause mutations and cancer.
## Communications
- Radio and microwaves are used for transmitting information because they pass through the atmosphere
- Optical fibres carry pulses of light or infrared by total internal reflection and are used for broadband and endoscopes
- Digital signals carry information as pulses of 1 and 0 and can be regenerated without noise. Analogue signals vary continuously and pick up noise, which gets amplified along with the signal.
- Mobile phones use microwaves. Evidence of health risk is uncertain, so research continues.
## Using wave equations
Because v is constant for all EM waves in a vacuum, higher frequency means shorter wavelength: **c = fλ**.
!eg Radio waves of frequency 1.5 × 10^8^ Hz have wavelength = 3 × 10^8^ ÷ 1.5 × 10^8^ = 2 m.
!tip When explaining dangers, state the type of radiation, its effect (ionises, damages cells or DNA) and the consequence (cancer, burns).`,

["Describe reflection in plane mirrors","Use Snell's law n = sin i ÷ sin r","Describe total internal reflection and calculate critical angle","Describe converging lenses and image formation","Describe how sound is produced, transmitted and detected"],
`## Reflection
For reflection the angle of incidence i equals the angle of reflection r, both measured from the **normal**. An image in a plane mirror is virtual (cannot be projected), upright, the same size, and as far behind the mirror as the object is in front.
## Refraction
Light bends towards the normal when it enters a denser medium (it slows down) and away from the normal when entering a less dense medium.
**Refractive index n = sin i ÷ sin r**
!eg A ray enters glass at an angle of incidence of 40° and refracts at 25°. n = sin 40 ÷ sin 25 = 0.643 ÷ 0.423 = 1.52.
Core practical: trace a ray through a glass block with a ray box. Mark the incident ray and emergent ray, join them, measure angles and calculate n.
## Total internal reflection
At a boundary between glass and air, if the angle of incidence is greater than the **critical angle c**, all the light is reflected back inside. **sin c = 1 ÷ n**. Used in optical fibres, prisms in binoculars and reflectors on bikes.
## Dispersion
White light splits into a spectrum when refracted through a prism since different colours refract by different amounts (violet the most, red the least).
## Lenses
A **converging (convex) lens** brings parallel rays to a focus at the **principal focus**. The focal length is the distance from the lens to the principal focus.
- Object beyond 2F: image is real, inverted and smaller
- Object between F and 2F: real, inverted and larger
- Object closer than F: virtual, upright and magnified (magnifying glass)
## Sound
Sound is made by vibrating objects. It is a longitudinal wave that needs a medium. An echo is reflected sound.
**Speed = distance ÷ time**, e.g. echoes are used to find distance: d = (v × t) ÷ 2.
**Ultrasound** (above 20 kHz) is used in medical scanning, cleaning, and sonar. The time between sending a pulse and receiving the echo gives the depth.
!tip In ray diagrams use a ruler, draw arrows on rays, and measure angles from the normal, not from the surface.`,

T("phys","p9","4","Energy, work and power","Energy stores and transfers, conservation, efficiency, work done and power.",4,
["Describe energy stores and transfers","Use the principle of conservation of energy","Calculate kinetic and gravitational potential energy","Calculate work done, power and efficiency","Describe thermal energy transfer by conduction, convection and radiation"],
`## Energy stores and transfers
Energy cannot be created or destroyed, only transferred from one store to another (**conservation of energy**). Stores: kinetic, gravitational potential, elastic potential, chemical, thermal, nuclear. Transfers: mechanically (forces), electrically, by heating, by waves.
## Calculations
**Kinetic energy = ½ × m × v^2^**
**Gravitational potential energy = m × g × h**
**Work done = force × distance moved in the direction of the force** (J)
**Power = work done ÷ time = energy transferred ÷ time** (W)
!eg A 2 kg ball is dropped from 5 m. GPE lost = 2 × 10 × 5 = 100 J. If all of it becomes kinetic energy, ½ × 2 × v^2^ = 100, so v = 10 m/s.
!eg A crane lifts 500 kg through 12 m in 20 s. Work = 500 × 10 × 12 = 60 000 J. Power = 60 000 ÷ 20 = 3000 W.
## Efficiency
**Efficiency = useful energy output ÷ total energy input** (× 100 for a percentage). Energy that is not usefully transferred is wasted, usually as heat, and is eventually spread out in the surroundings. No device is 100% efficient. Reduce waste with lubrication, insulation and better design.
## Thermal energy transfer
| Process | How | Where |
| Conduction | Vibrating particles pass energy to neighbours; free electrons in metals speed it up | Solids, especially metals |
| Convection | Hot fluid expands, becomes less dense and rises; cooler fluid sinks, forming currents | Liquids and gases |
| Radiation | Infrared waves; no medium needed | Anywhere, including a vacuum |
Dark, matt surfaces are the best absorbers and emitters of infrared; light, shiny surfaces are the best reflectors.
### Reducing heat loss in homes
Loft insulation and cavity wall insulation trap air (a poor conductor), double glazing, draught excluders, and foil behind radiators. Payback time = cost ÷ annual saving.
### Vacuum flask
Vacuum between the walls stops conduction and convection; silvered surfaces reduce radiation; the stopper stops convection and evaporation.
!tip When asked which energy transfers occur, name both the stores and the process: "chemical store to kinetic store by electrical working".`,

T("phys","p10","4","Energy resources","Renewable and non-renewable sources, electricity generation, and comparing resources.",4,
["Classify resources as renewable or non-renewable","Describe how electricity is generated in power stations","Evaluate advantages and disadvantages of resources","Explain the role of the National Grid and transformers","Describe the importance of conservation and efficiency"],
`## Non-renewable
Coal, oil and gas (fossil fuels) and nuclear fuel (uranium and plutonium) will run out.
**Fossil fuel power station:** fuel burns → water heated to steam → steam turns a turbine → turbine drives a generator → electricity. Burning fossil fuels releases CO~2~, and coal and oil release SO~2~ which cause acid rain.
**Nuclear:** energy from nuclear fission heats water. No CO~2~ emissions and a very small mass of fuel, but radioactive waste must be stored for thousands of years, and accidents can have severe consequences.
## Renewable
| Resource | How it works | Advantage | Disadvantage |
| Wind | Turbine blades turn a generator | No pollution, no fuel cost | Depends on wind; visual impact |
| Solar cells | Light directly to electricity | No pollution; good for remote places | Needs sunlight; costly per unit |
| Hydroelectric | Falling water turns turbines | Reliable, fast start | Floods land; dam is costly |
| Tidal | Rising and falling tides turn turbines | Predictable | Costly; affects wildlife |
| Wave | Movement of waves drives generator | No pollution | Unreliable; hard to build |
| Geothermal | Heat from hot rocks makes steam | Reliable | Only in certain places |
| Biofuels | Burn plant matter | Carbon neutral over time | Land use competes with food |
Choose a resource by considering reliability, cost, environmental effect and where it can be used.
## The National Grid
Electricity is transmitted at **high voltage** in overhead cables. High voltage means low current for the same power (P = IV), so there is less energy lost as heat (P = I^2^R). A step-up transformer raises the voltage at the power station and step-down transformers reduce it near homes.
## Saving energy
Use of energy-efficient appliances, good insulation, turning off devices, and using public transport lower energy demand and reduce emissions.

`## Density
**density = mass ÷ volume** (ρ = m ÷ V), in kg/m^3^ or g/cm^3^. 1 g/cm^3^ = 1000 kg/m^3^. Water has a density of 1 g/cm^3^.
### Core practical: density
- **Regular solid**: measure mass on a balance, volume from length × width × height
- **Irregular solid**: measure mass, then volume by displacement: put it in a eureka can or a measuring cylinder and record the water displaced
- **Liquid**: weigh an empty measuring cylinder, add liquid, record volume and the new mass
Objects float if their density is less than the fluid they are in.
## Pressure
**pressure = force ÷ area** (p = F ÷ A), in pascals (Pa) or N/m^2^. A force spread over a smaller area causes greater pressure: knives and nails are sharp; skis and caterpillar tracks are wide.
!eg A 600 N person stands on feet with total area 0.03 m^2^. p = 600 ÷ 0.03 = 20 000 Pa.
### Pressure in a liquid
**pressure = height × density × g** (p = hρg)
Pressure increases with depth and with the density of the liquid, and acts equally in all directions at a point.
!eg At 10 m depth in water: p = 10 × 1000 × 10 = 100 000 Pa (plus atmospheric pressure).
Hydraulic systems use liquids because they are virtually incompressible, so pressure is transmitted. A small force on a small piston gives a large force on a large piston.
## The kinetic model
- **Solids**: particles vibrate about fixed positions
- **Liquids**: particles close but free to move around
- **Gases**: particles far apart, moving randomly at high speed
**Gas pressure** is caused by gas particles colliding with the walls of the container and exerting a force. Heating a gas at constant volume makes the particles move faster, hit the walls harder and more often, so the pressure rises. Reducing the volume packs particles closer, so more frequent collisions and higher pressure.
## Brownian motion
Smoke particles viewed under a microscope move in random jerky paths. This is because of random collisions with fast-moving, invisible air molecules, and gives evidence for the particle model.
!tip In pressure and density questions, convert all units first (cm^2^ → m^2^ divide by 10 000).`,

`## Specific heat capacity
**Energy change = mass × specific heat capacity × temperature change** (Q = mcΔT)
Specific heat capacity (J/kg°C) is the energy needed to raise the temperature of 1 kg by 1 °C. Water has a high value (4200 J/kg°C).
!eg Heat 2 kg of water by 15 °C. Q = 2 × 4200 × 15 = 126 000 J.
### Core practical
Heat a block of material with an electrical heater: record the current, p.d., time and temperature rise. E = IVt, then c = E ÷ (m × ΔT). Insulate the block to reduce heat loss.
## Change of state and latent heat
**Energy = mass × specific latent heat** (Q = mL)
During melting or boiling the temperature stays constant: the energy goes into breaking bonds between particles, not into raising temperature (it increases potential energy, not kinetic energy). Specific latent heat of fusion is for melting; of vaporisation is for boiling.
On a heating curve, flat sections show a change of state.
## Temperature scales
Absolute zero is −273 °C or 0 K, the temperature at which particles have minimum kinetic energy. **K = °C + 273**. The kelvin temperature is proportional to the average kinetic energy of the particles.
## Gas laws
- **Boyle's law** (constant temperature): pV = constant, so p~1~V~1~ = p~2~V~2~
- **Pressure law** (constant volume): p ÷ T = constant, so p~1~ ÷ T~1~ = p~2~ ÷ T~2~ (T in kelvin)
- **Combined**: p~1~V~1~ ÷ T~1~ = p~2~V~2~ ÷ T~2~
!eg A gas at 100 kPa is compressed from 6 m^3^ to 2 m^3^ at constant temperature. p~2~ = 100 × 6 ÷ 2 = 300 kPa.
Explain with particles: smaller volume means particles hit the walls more often, so the pressure rises. Higher temperature means faster particles that collide harder and more often.
!mistake Always convert °C to kelvin in gas law calculations.`,

T("phys","p13","6","Magnetism and electromagnetism","Magnetic fields, electromagnets, the motor effect, induction, generators and transformers.",6,

`## Magnets
Magnetic poles: like poles repel and unlike attract. Magnetic materials are iron, steel, cobalt, nickel. A magnetic field is a region where a magnetic material experiences a force. Field lines run **from north to south**; they are closer where the field is stronger. Permanent magnets keep their magnetism; **induced** magnets only act as magnets while near another magnet. Iron is a soft magnetic material (easily magnetised and demagnetised, so used in electromagnets); steel is hard (keeps magnetism, used in permanent magnets).
## Electromagnetism
A current in a wire produces a magnetic field in concentric circles around it. A **solenoid** (coil) gives a field like a bar magnet. Strength increases with more current, more turns, and an iron core. Electromagnets can be switched off, so they are used in cranes, relays and loudspeakers.
## Motor effect
A wire carrying a current in a magnetic field experiences a force. **Fleming's left-hand rule**: First finger = Field, seCond finger = Current, thuMb = Motion (force). The force is bigger with a stronger field, larger current, or a longer wire in the field. Reverse the current or field to reverse the force. A coil in a magnetic field with a **split-ring commutator** keeps turning in one direction: the d.c. motor. Loudspeakers also use the motor effect.
## Electromagnetic induction
Moving a wire through a magnetic field (or changing the field through a coil) induces a potential difference. If part of a complete circuit, a current flows. The p.d. is bigger when the movement is faster, the magnet is stronger, or the coil has more turns.
A **generator** (alternator) rotates a coil in a magnetic field using slip rings and brushes to make a.c.; speed up the rotation and the voltage and frequency increase.
## Transformers
Two coils wound on an iron core. An alternating current in the primary creates a changing magnetic field in the core, inducing an alternating p.d. in the secondary. They only work with a.c.
**V~s~ ÷ V~p~ = N~s~ ÷ N~p~**
For 100% efficient transformers: **V~p~ × I~p~ = V~s~ × I~s~**
!eg A transformer has 200 turns on the primary and 50 turns on the secondary. Primary voltage 240 V. V~s~ = 240 × 50 ÷ 200 = 60 V (step-down).
!tip A step-up transformer has more turns on the secondary; step-down has fewer.`,

`## The atom
Protons and neutrons (nucleons) are in the nucleus; electrons orbit. **Atomic number (Z)** is the number of protons; **mass number (A)** is the number of protons plus neutrons. **Isotopes** have the same Z but different A. Nuclear notation: ^A^~Z~X.
## Radioactive decay
Unstable nuclei emit radiation randomly to become more stable. **Ionising radiation** can knock electrons off atoms. Background radiation comes from rocks (radon gas), cosmic rays, food, and medical and nuclear sources.
| Radiation | Nature | Charge | Penetration | Ionising |
| Alpha (α) | Helium nucleus (2 protons + 2 neutrons) | +2 | Stopped by paper or a few cm of air | Strongly |
| Beta (β) | Fast electron from the nucleus | −1 | Stopped by a few mm of aluminium | Weakly |
| Gamma (γ) | Electromagnetic wave | 0 | Reduced by thick lead or concrete | Very weakly |
### Decay equations
Alpha decay: mass number falls by 4, atomic number falls by 2.
^238^~92~U → ^234^~90~Th + ^4^~2~He
Beta decay: a neutron turns into a proton. Mass number unchanged, atomic number rises by 1.
^14^~6~C → ^14^~7~N + ^0^~−1~e
Gamma emission: no change in mass or atomic number.
## Half-life
**Half-life** is the time taken for the number of undecayed nuclei (or the count rate) to halve.
!eg A sample has a half-life of 6 hours and a count rate of 800 counts/min. After 18 hours (3 half-lives): 800 → 400 → 200 → 100 counts/min.
Short half-life sources are suitable for medical tracers because they don't stay active long; long half-life for smoke alarms.
## Uses
- Smoke detectors (alpha)
- Thickness gauges for paper or foil (beta)
- Sterilising equipment and treating cancer (gamma)
- Medical tracers and imaging (gamma)
- Dating rocks and carbon dating
## Safety
Keep sources in lead-lined containers, use tongs, keep away from the body, limit exposure time, and wear a film badge.
## Fission and fusion
**Fission**: a large nucleus (uranium-235) absorbs a neutron and splits into two smaller nuclei, releasing neutrons and energy. These can trigger a **chain reaction**. Used in nuclear power stations; control rods absorb neutrons.
**Fusion**: two light nuclei (hydrogen isotopes) join to form a heavier nucleus, releasing energy. It happens in stars at high temperature and pressure, and needs extremely high temperatures to overcome the repulsion of the positively charged nuclei.
!mistake Half-life is not half the lifetime. Radioactive decay is random: half-life describes a large number of nuclei.`,

`## Gravity and the Solar System
The Sun is at the centre, with eight planets, dwarf planets, moons, asteroids and comets in orbit. Gravity provides the centripetal force. Gravitational field strength depends on mass of the planet: Earth 10 N/kg, Moon about 1.6 N/kg, Jupiter about 25 N/kg.
**Orbital speed = 2πr ÷ T**, where r is the orbit radius and T is the orbital period.
!eg The Earth orbits at r = 1.5 × 10^11^ m in 3.15 × 10^7^ s. v = 2π × 1.5 × 10^11^ ÷ 3.15 × 10^7^ ≈ 30 000 m/s.
A comet's orbit is a long ellipse: it speeds up as it nears the Sun and slows down far away. Planets have nearly circular orbits. Planets reflect the Sun's light and are only visible by reflected light.
## Stars
Stars form from clouds of dust and gas (a **nebula**) pulled together by gravity. When the core is hot enough, hydrogen fuses to helium and the star is stable, with gravity balanced by the outward pressure from fusion (**main sequence**).
- **Sun-sized stars**: red giant → planetary nebula → white dwarf
- **Much more massive stars**: red supergiant → supernova → neutron star or black hole
Elements heavier than iron are made in supernovae, so all the atoms in our bodies were formed in stars.
## Galaxies and the Universe
The Universe contains billions of galaxies. Our galaxy is the Milky Way. Light-years measure distances: one light-year is the distance light travels in a year, about 9.5 × 10^15^ m.
## Red-shift and the Big Bang
Light from distant galaxies is shifted to longer wavelengths (**red-shift**) because they are moving away. The further away a galaxy, the greater its red-shift and the faster it recedes: the Universe is expanding.
**Hubble's law**: speed of recession is proportional to distance. Running the expansion backwards suggests everything started from a very small, hot, dense point about 13.8 billion years ago: the **Big Bang**.
Evidence for the Big Bang:
- Red-shift of galaxies
- **Cosmic microwave background radiation (CMBR)**: microwave radiation from all directions in space, the stretched-out remains of the early hot Universe
!tip Red-shift is an increase in wavelength, not a change in colour of the galaxy. Don't mix it up with the Doppler effect for sound, which uses the same idea.`,

T("geo","g1","1.1","Population dynamics","Population growth, birth and death rates, the demographic transition model and population policies.",1,
["Explain the causes of population growth and change","Define birth rate, death rate and natural change","Describe and explain the stages of the demographic transition model","Explain the impacts of over- and under-population","Evaluate population policies using a case study"],
`## Population change
The world population is over 8 billion. Growth is fastest in low-income countries. Three things change a country's population: births, deaths and migration.
- **Birth rate**: live births per 1000 people per year
- **Death rate**: deaths per 1000 people per year
- **Natural change = birth rate − death rate** (as a per 1000 figure; divide by 10 for a %)
- **Net migration** = immigrants − emigrants
!eg Birth rate 32 and death rate 9 gives natural increase of 23 per 1000, or 2.3% a year.
## Factors affecting birth rate
**High** birth rate: no or little family planning, high infant mortality (so parents have more children), need for children to work on farms, religious or cultural beliefs favouring large families, low status of women in education and employment.
**Low** birth rate: contraception widely available, education and careers for women, high cost of raising children, later marriage, urban living.
## Factors affecting death rate
**High**: disease, famine, poor sanitation and water, poor healthcare, war. **Low**: good healthcare, clean water, enough food, vaccination, safe housing.
## Demographic transition model (DTM)
!fig dtm
| Stage | Birth rate | Death rate | Population growth | Why |
| 1 | High | High (fluctuating) | Low / stable | Disease, famine, no contraception |
| 2 | High | Falling fast | Rapid increase | Better medicine, food and sanitation |
| 3 | Falling | Low | Still growing, more slowly | Contraception, education, urbanisation |
| 4 | Low | Low | Low / stable | Small families, ageing population |
| 5 | Very low | Slightly higher | Decreasing | Ageing population, fewer births than deaths |
## Over- and under-population
**Over-population**: too many people for the resources available, causing low living standards, unemployment, shortage of food and water. **Under-population**: too few people to use the resources fully, causing a lack of skilled workers and a slow economy.
## Population policies
### Case study: China
China's **one-child policy** (1979–2015) cut the number of births and slowed growth, and reduced pressure on resources. Problems: an ageing population, fewer workers to support elderly people, a gender imbalance (preference for sons), and the "4-2-1" problem where one child supports two parents and four grandparents. The policy changed to two children (2016) and three (2021).
Other approaches: Singapore encouraged births with tax breaks and baby bonuses; many countries promote family planning and women's education.
!tip In a question about a policy, give both successes and problems, and use named facts and dates.`,

`## Types of migration
- **Internal**: within a country (rural to urban is the main flow worldwide)
- **International**: between countries
- **Voluntary**: people choose to move, usually for work or a better life
- **Forced**: people have to leave because of war, persecution or disaster. **Refugees** cross an international border; **internally displaced people (IDPs)** stay in their own country.
- **Economic migrants** move to find work.
## Push and pull factors
| Push (reasons for leaving) | Pull (reasons for choosing a place) |
| Unemployment and low wages | Job opportunities and higher wages |
| Poverty, famine, drought | Better food supply, services |
| War, conflict, persecution | Safety and political stability |
| Natural hazards | Better schools and hospitals |
| Poor services | Family and friends already there |
Barriers: cost, visa controls, language, distance, border security.
## Impacts
| | Source area | Destination area |
| Positive | Money sent home (remittances); fewer people competing for jobs and resources; migrants may return with new skills | Workers fill gaps in the labour market; boosts economy; adds cultural diversity; younger population |
| Negative | Loss of young, skilled workers (brain drain); ageing population left behind; families split | Pressure on housing, schools and healthcare; competition for low-paid jobs; possible tension; informal settlements |
### Case study: Syria to Europe and neighbouring countries
Civil war from 2011 forced millions to flee. Most went to neighbouring Turkey, Lebanon and Jordan, with large numbers later moving to Germany and other EU states. Push: bombing, violence, destroyed homes and services. Pull: safety, Germany's asylum policy, jobs, existing Syrian communities. Impacts: pressure on services in host countries, loss of professionals from Syria, and debates in Europe about integration and border control.
### Rural to urban migration
Poor farming incomes push people from villages; cities offer jobs, schools and healthcare. It causes shanty towns in cities and empty villages with ageing populations.
!tip Always match the factor to the right place: push factors are about the origin, pull factors about the destination.`,

`## Population pyramids
A population pyramid shows the number (or percentage) of males and females in each age group.
!fig pyramid
| Shape | Meaning | Example |
| Wide base, steep sides | High birth rate and high death rate. Expanding population | Nigeria, Niger |
| Straighter sides, narrower base | Low birth rate, long life expectancy, ageing | Japan, Germany |
| Bulge in the middle | Past baby boom or migration of workers | UK in places |
Reading a pyramid: look at the base (birth rate), the width of the top (life expectancy), and any indentations (wars, famine, migration).
## Dependency ratio
**Dependants** are people aged 0–14 and 65+ who rely on the working population (15–64).
**Dependency ratio = (number aged 0–14 + number 65+) ÷ number aged 15–64 × 100**
!eg Youth 30 million, elderly 10 million, working-age 60 million. Ratio = 40 ÷ 60 × 100 = 66.7 dependants per 100 workers.
## Youthful populations (e.g. Nigeria)
Problems: need to build schools and provide jobs, pressure on food and housing, high youth unemployment, high spending on education rather than development. Benefits: a large future workforce; flexible, innovative population.
## Ageing populations (e.g. Japan)
Over a quarter of Japanese people are 65 or older. Problems: more pensions and healthcare to pay for, fewer workers paying taxes, labour shortages, rural depopulation. Solutions: raise retirement age, encourage immigration, encourage births (child allowances), robotics and automation, encourage older workers to stay on.
## Linking to the DTM
Stage 2 countries have expanding pyramids; Stage 4 and 5 countries have narrow bases and large elderly populations.
!tip When describing a pyramid, use data: "20% of the population is under 5 compared with 3% over 65". Use comparative language.`,

`## Definitions
**Population distribution** describes how people are spread out over an area. **Population density** is the number of people per square kilometre.
**Population density = total population ÷ total area (km^2^)**
!eg 12 million people live in an area of 4000 km^2^: density = 12 000 000 ÷ 4000 = 3000 people per km^2^.
## Physical factors
| Factor | Dense population | Sparse population |
| Relief | Flat, low land easy to build and farm | Steep mountains hard to build on |
| Climate | Moderate temperature and rainfall | Extreme heat, cold or aridity |
| Soil | Fertile (river floodplains, volcanic soils) | Thin, infertile or waterlogged |
| Water | Reliable supply, rivers | Little or none (deserts) |
| Natural resources | Minerals, energy, timber nearby | Few resources |
| Vegetation | Grassland, easy to clear | Dense forest, tundra |
| Natural hazards | (some people live near volcanoes for fertile soils) | Frequent floods, earthquakes |
## Human factors
- **Economic**: jobs in industry and services attract people to cities and ports
- **Political**: stable governments and safe borders attract people; war repels them; government policy can direct people to move
- **Social**: services, family ties, culture and religion influence where people choose to live
- **Transport**: good links encourage settlement
## Examples
**Densely populated:** Bangladesh (Ganges–Brahmaputra delta) has fertile floodplains, a reliable water supply and an agricultural economy. The Netherlands, Japan's coastal plains, the Nile valley, and south-east England are also dense.
**Sparsely populated:** The Sahara (aridity, extreme heat), Siberia and Greenland (extreme cold, permafrost), the Amazon basin (dense forest, hard to access) and the Himalayas (steep, high altitude).
!tip Don't just list the factors. Explain: "Flat land with fertile alluvium (physical) means farming is easy, so more people can be fed."`,

["m","Which is a physical factor that encourages dense population?",["Flat land","High mountains","Desert","Permafrost"],0,"Flat land is easy to build and farm."],

T("geo","g5","1.5","Settlements and service provision","Site, situation, patterns, settlement hierarchy and the sphere of influence of services.",1,

`## Site, situation and function
- **Site**: the exact piece of land the settlement is built on
- **Situation**: the position of the settlement in relation to its surroundings
- **Function**: the main job of the settlement (market town, port, resort, administrative centre)
Factors influencing site:
- **Water supply** (rivers, springs, wells)
- **Building materials** (stone, wood)
- **Dry-point sites** on raised ground to avoid floods, and **wet-point sites** close to water
- **Defence** (hilltops, river bends, islands)
- **Flat land** for building
- **Fertile soil** and **accessibility** (routeways, bridging points)
## Settlement patterns
| Pattern | Description | Where |
| Nucleated | Buildings clustered around a central point | Village around a crossroads or market square |
| Linear | Buildings in a line | Along a road, river or coast |
| Dispersed | Buildings spread widely | Remote farming areas |
## Hierarchy
Settlements range in size from hamlets, villages, towns and cities to conurbations. There are more small settlements than large ones. Larger settlements offer a wider range of services (hospitals, universities, department stores), and are fewer, spaced further apart.
- **Low-order (convenience) goods**: bought often, near home (newspapers, bread)
- **High-order (comparison) goods**: bought rarely, travel further (jewellery, cars)
## Service provision
- **Threshold population**: the minimum number of people needed to support a service
- **Range**: the maximum distance people will travel to use a service
- **Sphere of influence**: the area served by a settlement or service
High-order services have a high threshold and long range, so a large sphere of influence. Low-order services have a low threshold and short range.
!eg A small corner shop needs maybe 500 customers within 400 m. A university needs hundreds of thousands of people across a region.
## Rural settlements
Rural areas often have a decline in services because of falling populations, the closure of village shops and schools, and the movement of young people to cities. Better transport and the internet can help.
!tip Keep site and situation apart: site is about a specific place (flat land by a river), situation is about the surrounding area and links to others.`,

["Sphere of influence","The area from which a settlement or service draws customers"]],

`## Land-use zones
In most cities there are recognisable zones:
- **Central business district (CBD)**: highest land values, department stores, offices, banks, high-rise buildings, best public transport, few people live there
- **Inner city**: older terraced housing, former factories; often run down and in need of regeneration
- **Suburbs**: houses with gardens, lower density, more space, more green areas
- **Rural-urban fringe**: edge of the city; new housing estates, retail parks, airports, golf courses
## The Burgess (concentric) model
Land use is arranged in rings around the CBD. Land value and building density decrease with distance from the centre since accessibility falls. At the centre, land is expensive so buildings are tall. Real cities are more complex, with transport routes, rivers and planning decisions that change the pattern.
## High-income and low-income cities
| | High-income city | Low-income city |
| Newest housing | Outskirts: suburban estates | Edge: informal settlements of squatters |
| Poorest housing | Inner city | Squatter settlements on outskirts |
| Wealthiest area | Suburbs | Close to the CBD or in gated areas |
| Issues | Traffic, decline of inner city, urban sprawl | Lack of services, rapid growth |
## Problems of urban areas
- **Traffic congestion**: more cars, narrow roads. Solutions: public transport, park-and-ride, congestion charges, cycle lanes
- **Urban sprawl**: loss of green land. Solutions: green belts, building on brownfield sites
- **Pollution** (air, noise, water): low emission zones, cleaner transport
- **Inner-city decline**: regeneration schemes (e.g. London Docklands)
- **Housing shortages** and homelessness
- **Crime** and social deprivation
## Brownfield and greenfield sites
Brownfield sites are previously built-on land (cheaper services, less countryside loss, but contaminated land can cost more to clean). Greenfield sites are undeveloped land (cheaper and easier to build, but loses countryside and habitats).
!tip For a land use question, give the name of the zone, the type of buildings, and the reason (land value, accessibility).`,

`## What is urbanisation?
**Urbanisation** is an increase in the percentage of people living in towns and cities. More than half the world's people are urban, and growth is fastest in Asia and Africa. High-income countries urbanised during the industrial revolution; now cities there are mostly stable or counter-urbanising.
## Causes
- **Rural-to-urban migration**: caused by rural push factors (poor farmland, drought, lack of jobs and services) and urban pull factors (jobs, better schools and hospitals)
- **Natural increase**: migrants are mostly young adults, so birth rates are high in cities
## Problems of rapid growth in low-income cities
- **Shanty towns / squatter settlements**: poor-quality housing built from scrap with no legal rights to the land
- **Lack of services**: no clean water, sewers, electricity, schools
- **Unemployment** and **informal sector** jobs
- **Pollution and traffic**
- **Health problems**: disease from poor sanitation
- **Crime**
### Case study: Rio de Janeiro, Brazil (favelas)
Migrants came from the poor north-east. Favelas such as Rocinha grew on steep hillsides, with insecure homes, limited water and sewage, risk of landslides, and violence. The **Favela Bairro** project began in the 1990s: it provided paved roads, drainage, water and electricity, community centres and legal land title so people could invest in their own homes. Self-help schemes worked because residents provided the labour. Problems remain with inequality and security.
## Strategies
- **Self-help schemes**: residents are given materials and build their own houses
- **Site and service schemes**: the government provides plots with water and sewers; owners build
- **Improved public transport**, new towns, regeneration of inner areas
## Counter-urbanisation
Movement of people from cities to the countryside, often for a quieter life, cheaper housing and the ability to work from home. Effects: rising house prices in villages, commuting, and demand on rural services.
!tip For case-study questions, name the place (Rocinha), the project (Favela Bairro), the date and a result.`,

T("geo","g8","2.1","Earthquakes and volcanoes","Plate tectonics, plate boundaries, volcano types, hazards and management with case studies.",2,

`## Earth structure
Crust (thin, solid), mantle (semi-molten rock, convection currents), outer core (liquid iron and nickel) and inner core (solid). The crust is split into large **tectonic plates** that move a few centimetres per year, driven by convection currents in the mantle.
## Plate boundaries
!fig plates
| Boundary | Movement | Features |
| Constructive (divergent) | Plates move apart | Magma rises; shield volcanoes, mid-ocean ridges (Iceland); gentle earthquakes |
| Destructive (convergent) | Oceanic plate sinks under continental (subduction) | Ocean trenches, composite volcanoes, powerful earthquakes (Andes, Japan) |
| Collision | Two continental plates push together | Fold mountains, strong earthquakes (Himalayas) |
| Conservative | Plates slide past | Earthquakes only (San Andreas Fault) |
## Earthquakes
Stress builds when plates stick, then is released suddenly as seismic waves. The **focus** is the point underground where it starts; the **epicentre** is the point on the surface directly above. Measured using a seismometer (Richter scale or magnitude scale), with the Mercalli scale describing damage. Shallow earthquakes cause the most damage.
## Volcanoes
- **Composite (stratovolcano)**: steep sides, alternating layers of ash and lava, explosive, at destructive boundaries
- **Shield**: wide, gentle slopes of runny lava, at constructive boundaries or hotspots
Hazards: lava flows, ash clouds, pyroclastic flows, lahars (mudflows), gases.
## Why live near these hazards?
Fertile volcanic soils, geothermal energy, tourism, minerals and few other options for the poor.
## Impacts and responses
**Primary effects** are immediate (collapsed buildings, deaths). **Secondary effects** follow (fires, tsunamis, disease, loss of jobs). **Short-term responses** are rescue and aid; **long-term responses** are rebuilding and better planning.
Management: prediction (monitoring gas, seismic activity — earthquakes cannot be predicted accurately), protection (earthquake-proof buildings with deep foundations, steel frames and shock absorbers), and planning (drills, evacuation routes, land-use zoning).
### Case study: Haiti earthquake, January 2010
Magnitude 7.0, shallow focus (about 13 km) near Port-au-Prince, a large and densely populated city. Over 200 000 died and over a million were left homeless. Poor-quality buildings collapsed, and there were few emergency services. Cholera followed, and recovery was slow because Haiti is a low-income country with limited resources.
### Case study: Tohoku, Japan, March 2011
Magnitude 9.0 offshore, producing a huge tsunami. About 18 000 people died or went missing. Strong building codes saved many lives from the shaking, but the tsunami destroyed coastal towns and caused the Fukushima nuclear accident. Warning systems and drills helped people evacuate.
!tip Compare using the same criteria: magnitude, depth, building quality, preparedness, and aid. Use numbers.`,
[["Tectonic plate","A large section of the Earth's crust that moves slowly"],
["Subduction","One plate sinking beneath another at a destructive boundary"],
["Focus","The point underground where an earthquake begins"],
["Epicentre","The point on the surface directly above the focus"],
["Magma","Molten rock below the Earth's surface"],
["Tsunami","A giant sea wave caused by an underwater earthquake or eruption"],
["Composite volcano","A steep volcano formed from layers of ash and lava"],
["Primary effect","An immediate result of a hazard, such as collapsed buildings"]],
[["m","What type of plate boundary is the San Andreas Fault?",["Constructive","Destructive","Collision","Conservative"],3,"Plates slide past each other."],
["m","The point on the surface above an earthquake's focus is called the",["Hypocentre","Epicentre","Crater","Fault"],1,"Epicentre."],

T("geo","g9","2.2","Rivers","River processes, landforms, hydrographs, flooding and management.",2,

`## Drainage basin
The area drained by a river and its tributaries. Features: **source**, **tributary**, **confluence**, **watershed**, **mouth**.
## River processes
- **Erosion**: hydraulic action (force of water), abrasion (load scraping the bed and banks), attrition (load particles knocking together and wearing smaller and rounder), solution (dissolving rock)
- **Transport**: traction (rolling large stones), saltation (bouncing), suspension (carried in the water), solution (dissolved)
- **Deposition** occurs when the river loses energy (lower flow, shallow water, end of river)
## Landforms
!fig river
- **V-shaped valley** (upper course): vertical erosion
- **Waterfalls and gorges**: a hard rock band over softer rock; softer rock eroded, plunge pool formed by hydraulic action and abrasion, undercutting then collapse; the waterfall retreats upstream leaving a gorge
- **Meanders and oxbow lakes** (middle/lower course): erosion on the outer bend (river cliff) where flow is fastest, deposition on the inner bend (slip-off slope). Over time the neck narrows, the river breaks through in a flood, and the old meander is cut off as an oxbow lake
- **Floodplains and levees**: the flat land flooded regularly; coarsest sediment deposited near the bank to form natural levees
- **Deltas**: formed where a river deposits its load as it enters a calm sea
## Hydrographs and flooding
A **flood hydrograph** shows discharge over time after rainfall. **Lag time** is the time between peak rainfall and peak discharge.
Floods are more likely with: heavy or prolonged rainfall, steep slopes, impermeable rock, saturated soil, deforestation, and urbanisation (concrete and tarmac, drains quickly carry water to rivers) resulting in a short lag time and a high peak.
## Managing floods
| Hard engineering | Soft engineering |
| Dams and reservoirs | Flood warnings and preparation |
| Embankments / levees | Afforestation (planting trees) |
| Straightening channel | Flood plain zoning (no building) |
| | Washlands / natural flood storage |
Hard engineering protects well but is costly and may increase flooding downstream. Soft is cheaper and more sustainable but gives less protection.
### Case study: Pakistan floods, 2022
Exceptional monsoon rain and glacier melt flooded about a third of the country. More than 1700 died and about 33 million were affected, with huge losses of crops, livestock and roads. Causes included extreme rainfall and a poorly maintained flood infrastructure. Responses: international aid, evacuation, and reconstruction needing billions of dollars.
!tip For landform formation answers, describe processes in order: use arrows or numbered steps.`,

["Tributary","A smaller river that joins a larger river"],
["Watershed","The edge of high land separating two drainage basins"],
["Hydraulic action","The force of water breaking up rock on the river bed and banks"],
["Abrasion","Erosion caused by the river's load scraping the bed and banks"],
["Attrition","Rocks hitting each other, becoming smaller and rounder"],
["Lag time","Time between peak rainfall and peak river discharge"],
["Levee","A raised bank along a river formed by deposition during floods"]],
[["m","Where does a river deposit most material?",["V-shaped valley","Inner bend of a meander","Outer bend of a meander","Waterfall"],1,"Slower flow on the inner bend."],
["m","Which is soft engineering?",["Dam","Embankment","Flood warnings","Straightening the channel"],2,"Soft engineering works with nature."],
["m","A short lag time in a hydrograph is typical of",["A large rural basin","A heavily urbanised basin","A flat porous basin","A forested basin"],1,"Impermeable surfaces send water quickly to the river."],
["s","Describe and explain the formation of an oxbow lake.",5,["Erosion on outer bends and deposition on inner bends","Meander neck narrows","River breaks through in a flood","Takes the shorter path","Deposition seals off the old meander"]],
["s","Explain how urbanisation can increase flood risk.",3,["Impermeable surfaces (concrete/tarmac) reduce infiltration","Drains carry water quickly to rivers","Shorter lag time and higher peak flow"]]]);

T("geo","g10","2.3","Coasts","Waves, coastal processes, landforms of erosion and deposition, coral reefs, mangroves and management.",2,
["Describe constructive and destructive waves","Describe coastal processes","Explain the formation of coastal landforms","Describe coral reef and mangrove conditions and threats","Evaluate coastal management strategies"],
`## Waves
| | Constructive | Destructive |
| Wave height | Low | High |
| Frequency | 6–8 per minute | 10–14 per minute |
| Swash vs backwash | Strong swash, weak backwash | Weak swash, strong backwash |
| Effect | Deposits material, builds beach | Erodes beach |
Waves are caused by wind blowing over the sea. The distance of open water (**fetch**) affects wave size.
## Processes
- **Erosion**: hydraulic action, abrasion, attrition, solution
- **Transport**: **longshore drift** moves material along the coast in a zig-zag as waves approach at an angle
- **Deposition**: when waves lose energy
## Landforms of erosion
Wave-cut notch → cliff retreats leaving a **wave-cut platform**. A crack in a headland widens to a **cave**, then an **arch**, then a **stack**, then a **stump**. Headlands form on hard rock, and bays form in softer rock.
Example: the Dorset coast (Lulworth Cove, Durdle Door).
## Landforms of deposition
Beaches (sand and shingle), **spits** (long ridges of sand joined to land at one end, e.g. Spurn Head) formed by longshore drift where the coast changes direction; **bars** (a spit that grows across a bay).
## Coral reefs
Formed by tiny organisms (polyps) secreting calcium carbonate. Needs: warm clear shallow water (above 18 °C, ideally 25–29 °C), sunlight, salty water, no sediment. Types: fringing, barrier and atoll. Threats: **bleaching** from rising sea temperatures, pollution, overfishing, tourism and boat damage.
## Mangroves
Trees growing in salty tidal water in tropical areas, with prop roots. They protect coastlines from erosion and storm surges, trap sediment, and provide nursery habitats for fish. Threats: clearance for shrimp farms and tourism development.
## Coastal management
| Hard | Soft |
| Sea walls | Beach nourishment |
| Groynes | Dune regeneration |
| Rip rap (large boulders) | Managed retreat (letting the sea flood) |
### Case study: Holderness coast, Yorkshire
One of Europe's fastest eroding coastlines, at around 2 m per year, because it is made of soft boulder clay, and has strong waves from a long fetch across the North Sea. Villages and farmland have been lost. Hard defences protect Withernsea and Hornsea, while the groynes cause erosion further south (Spurn Head and Easington). Costs and benefits are weighed for each place.
!tip In management questions, link the choice to the value of what is being protected: a town gets a sea wall, farmland may not.`,

`## Weather vs climate
**Weather** is the day-to-day state of the atmosphere. **Climate** is the average weather over at least 30 years.
## Elements and instruments
| Element | Instrument | Unit |
| Temperature | Maximum–minimum thermometer | °C |
| Rainfall | Rain gauge | mm |
| Air pressure | Barometer | millibars / hPa |
| Wind speed | Anemometer | km/h, m/s, knots |
| Wind direction | Wind vane | Compass points |
| Humidity | Wet and dry bulb thermometers (hygrometer) | % |
| Sunshine | Sunshine recorder | Hours |
| Cloud cover | Observation | Oktas (eighths) |
## The Stevenson screen
A white wooden box with louvres (slats), standing on legs 1.2 m above short grass in an open site. White paint reflects the Sun's heat, louvres let air circulate but keep out direct sunlight and rain, and the height avoids the heat radiating from the ground.
Rain gauge: place in an open area away from trees and buildings, with the funnel above ground level so that rain does not splash in.
## Using data
- **Mean** = total ÷ number of values. **Range** = highest − lowest. **Mode** = most common. **Median** = middle value.
- Temperature is shown with a line graph; rainfall with a bar graph. A **climate graph** combines both.
- Wind roses show direction, and weather symbols are used on synoptic charts.
## Types of rainfall
- **Convectional**: the ground heats the air, which rises, cools and condenses into cumulonimbus clouds, giving heavy rain, often in afternoons (typical in equatorial regions).
- **Relief (orographic)**: moist air forced to rise over mountains, cools, condenses and rains on the windward side. The leeward side is dry (a rain shadow).
- **Frontal**: warm air rises over cold air at a front, cooling and condensing to give widespread rainfall (typical in the UK).
!eg Monthly rainfall for 5 months: 40, 55, 35, 60, 50 mm. Mean = 240 ÷ 5 = 48 mm. Range = 60 − 35 = 25 mm.
!tip When describing a climate graph, quote values and months: "temperature stays between 26 °C and 28 °C all year; rainfall peaks at 300 mm in April".`,

["Anemometer","An instrument that measures wind speed"],

`## Equatorial climate
Located within about 5° of the Equator. **Temperature**: 26–28 °C all year, with a very small annual range because the Sun is high all year. **Rainfall**: over 2000 mm a year, with convectional storms almost every afternoon. Humid.
## Tropical rainforest
Found in the Amazon, Congo and South-East Asia. The rainforest has the greatest biodiversity on Earth.
**Layers**: emergent (very tall trees above the canopy), canopy (dense, most of the life), understorey, shrub layer / forest floor (dark and sparse).
**Adaptations**: drip-tip leaves shed heavy rain, buttress roots support tall trees in shallow soil, lianas climb to reach light, epiphytes grow on branches, thick waxy leaves, and shallow roots for the nutrient-rich top layer. **Nutrient cycle**: rapid decomposition returns nutrients to the shallow topsoil, and trees take them back up quickly.
### Deforestation
Causes: logging, cattle ranching, soya farming, mining, road building, settlement, palm oil.
Effects: loss of habitats and biodiversity; soil erosion once the roots no longer bind it and nutrients are lost; flooding; less transpiration so reduced rainfall; more carbon dioxide (climate change); loss of indigenous peoples' livelihoods. Benefits: income and jobs, minerals, farmland.
Sustainable management: selective logging, replanting, protected areas and reserves, ecotourism, education, and laws against illegal logging.
## Hot desert climate
E.g. the Sahara. **Temperature**: very hot days (above 40 °C), cold nights because clear skies allow heat to escape, so a large daily range. **Rainfall**: below 250 mm a year, unreliable. Cloudless skies and descending dry air are the reasons.
**Adaptations**: cacti store water in thick stems and have spines to reduce water loss; long roots reach deep water or spread widely near the surface; small leaves reduce transpiration; seeds lie dormant until rain. Animals: camels store fat, nocturnal behaviour, burrowing.
### Desertification
The spread of desert-like conditions due to drought and overgrazing, deforestation for fuel, and over-cultivation. Solutions: tree planting (Great Green Wall in Africa), appropriate technology such as stone lines, controlled grazing, and water management.
!tip Link each adaptation to the problem it solves: "drip-tip leaves – shed water quickly – prevents fungal growth".`,

["Deforestation","The clearing of forests"],
["Desertification","The process by which land becomes desert"],
["Xerophyte","A plant adapted to survive in dry conditions"],
["Sustainable management","Using resources so that they continue to be available for the future"]],
[["m","Which feature is an adaptation to heavy rainfall in the rainforest?",["Spines","Drip-tip leaves","Succulent stems","Long tap roots"],1,"Drip tips shed water."],

`## Measuring development
**Development** is the progress in a country's economic, social and technological standards of living.
| Indicator | Measures |
| GDP / GNI per capita | Average wealth (income per person) |
| Life expectancy | Health and care |
| Infant mortality | Healthcare quality |
| Literacy rate | Education |
| People per doctor | Health provision |
| Access to clean water / electricity | Basic services |
| **HDI** | Combined index (0–1) of life expectancy, education and income |
The Human Development Index (HDI) is more reliable than GDP alone because it includes social factors. Averages can hide inequality, e.g. a rich minority and a poor majority.
## Economic sectors
- **Primary**: extracting raw materials (farming, mining, fishing)
- **Secondary**: manufacturing and construction
- **Tertiary**: services (teaching, retail, tourism)
- **Quaternary**: research and high-tech industries
As countries develop, employment shifts from primary to secondary then tertiary and quaternary. Low-income countries often have more than 60% in primary; high-income countries have 70% or more in services.
## Why do some countries stay poor?
- Physical: natural hazards, climate, poor soils, landlocked location
- Historical: colonialism, slavery, dependency on a few raw materials
- Economic: debt, trade barriers, low prices for primary goods
- Political: corruption, conflict, poor governance
- Social: poor education and healthcare, high population growth
## Reducing the development gap
- **Aid**: bilateral (country to country), multilateral (via the World Bank), or by non-governmental organisations (NGOs). Can bring quick help but may create dependency or be tied to conditions.
- Debt relief, fair trade, appropriate technology, trade agreements, investment by transnational corporations.
!tip Avoid saying "third world". Use high-income country (HIC), middle-income (MIC) and low-income (LIC).
!mistake GDP per capita does not show how wealth is shared. Mention inequality when evaluating indicators.`,

`## Farming as a system
- **Inputs**: seeds, labour, machinery, fertiliser, rainfall, soil, capital
- **Processes**: ploughing, planting, harvesting, feeding animals
- **Outputs**: crops, milk, meat, wool, profit, waste
## Types of farming
| Type | Description |
| Subsistence | Produce for the farmer's family; small farms, little surplus |
| Commercial | Produce to sell for profit; large, mechanised farms |
| Arable | Growing crops |
| Pastoral | Rearing animals |
| Mixed | Crops and animals |
| Intensive | High inputs on a small area to get a high yield |
| Extensive | Low inputs per hectare on a large area (e.g. cattle ranching, sheep) |
Example: intensive subsistence rice farming on small terraced plots in monsoon Asia; commercial wheat farming on huge prairie farms in Canada or the USA.
## Food shortages
**Famine** is a severe shortage of food. **Malnutrition** is a lack of balanced diet.
Causes: drought, floods, pests and diseases, poverty, conflict, poor transport and storage, rapid population growth, and unfair trade.
Effects: death and illness (especially children), stunted growth, low productivity, migration, dependency on food aid, and social unrest.
## Increasing food supply
- **Irrigation**: bringing water by canals, wells and pipes
- **High-yield variety (HYV) seeds**: the Green Revolution in India and Asia doubled rice and wheat yields
- **Fertilisers and pesticides**
- **Mechanisation**
- **Genetically modified (GM) crops**: higher yield or drought resistance, but concerns about cost and effects
- **Appropriate technology** such as terracing, drip irrigation, and fish ponds
- **Land reform** and cooperatives, **food aid** and education
Problems of increasing production: cost of inputs, soil degradation, water shortage, pollution, loss of habitats, and unequal access to food.
### Case study of a farm
Use a named example such as a wheat farm in the Canadian prairies (inputs: large machinery, fertiliser, flat fertile land; processes; outputs). Know the physical, economic and human inputs, and the issues.
!tip For "explain how" questions on food supply, always give the cause and its link to food: "drought – crops fail – less food available".`,

`## Industry as a system
- **Inputs**: raw materials, energy, labour, capital, land, technology
- **Processes**: cutting, assembling, shaping, packaging
- **Outputs**: finished products, waste, income
## Factors affecting location
| Factor | Why it matters |
| Raw materials | Heavy or bulky materials are expensive to move (steel works near iron ore and coal) |
| Energy | Cheap and reliable supply |
| Labour | Skilled or cheap workers |
| Transport links | Roads, railways, ports and airports for goods and workers |
| Markets | Close to customers reduces delivery costs |
| Capital | Money for building and equipment |
| Government policies | Grants, tax breaks, enterprise zones |
| Land | Cheap flat land |
Footloose industries (such as electronics assembly) are not tied to raw materials, so they can locate wherever labour and transport suit.
## Formal and informal
Formal jobs are legally registered with contracts and taxes. Informal jobs are unregulated (street vendors, small repair workshops), common in low-income countries. They offer income but low pay, poor safety and no benefits.
## Transnational corporations (TNCs)
TNCs operate in many countries (Nike, Apple, Toyota, Samsung). Headquarters and research stay in the home country, with manufacturing in countries with lower costs.
| Advantages to host country | Disadvantages to host country |
| Jobs and wages | Profits sent back to the home country |
| Technology and skills transfer | Low pay and poor working conditions |
| Investment, infrastructure | Pollution, resource use |
| Tax revenue and exports | Can leave if conditions change |
## Industrial change
**Globalisation** (worldwide links in trade and communication) has moved manufacturing from Europe and North America to Asia (the "workshop of the world"). **Deindustrialisation** left cities such as Sheffield and Detroit with unemployment, and they later regenerated through services and technology.
### Industrial zones
Special economic zones, like Shenzhen in China, attracted foreign firms with tax breaks and cheap labour. The city grew from a fishing village to a major technology centre.
!tip To evaluate TNCs, give a balanced view and conclude whether benefits outweigh costs for the host country.`,

T("geo","g16","3.4","Tourism","Growth of tourism, benefits and costs, and managing tourism sustainably.",3,

`## Growth of tourism
Tourism is one of the world's largest industries. Growth is due to: higher disposable incomes, more paid holiday time, cheaper and faster air travel, package holidays, the internet for booking, more retirees, and developing tourist infrastructure. Disruptions come from terrorism, natural disasters and pandemics such as COVID-19, which collapsed travel in 2020.
## Attractions
Physical: warm climate, beaches, mountains, wildlife, national parks. Human: culture, historic sites, theme parks, sport and events.
## Benefits and costs
| Benefits | Costs |
| Jobs (direct and indirect) | Seasonal, low-paid work |
| Foreign income for the economy | Leakage: profits go to foreign companies |
| Improved infrastructure | Rising prices for locals |
| Multiplier effect, supporting local businesses | Pressure on water and energy |
| Funds conservation | Pollution, litter, habitat damage, footpath erosion |
| | Cultural change; crowding |
## Sustainable tourism
Meets the needs of tourists and local people without harming the environment or culture for future generations. **Ecotourism** is small-scale, low-impact, educational and benefits local communities.
Management strategies: limit visitor numbers, charge entrance fees to fund conservation, zoning of sensitive areas, footpath repair, locally owned hotels and guides, educating visitors, and public transport.
### Case study: Kenya (wildlife tourism)
Tourism earns foreign currency and supports many jobs. The Maasai Mara National Reserve and the coast at Mombasa are major attractions. Benefits: income and jobs for local communities, funding to protect wildlife. Costs: crowding by vehicles damaging the savannah, disturbance of animals, leakage of profits, pressure on water, and a vulnerable economy when tourist numbers fall after attacks or health scares. Community conservancies, where local people share the income and manage land, are a sustainable response.
### Case study: Lake District National Park, UK
A high-income example: millions of visitors a year cause footpath erosion, traffic congestion and honeypot sites with congestion. Management includes path repairs, park-and-ride, and limiting building.
!tip Specific facts matter in case studies. Name the places, say who benefits and who loses, and give figures if you can.`,

`## Sources of energy
| Non-renewable | Renewable |
| Coal, oil, natural gas, nuclear fuel | Solar, wind, hydroelectric, geothermal, tidal, wave, biomass |
**Primary energy** is the source itself (coal, wind). **Secondary energy** such as electricity is produced from them.
## Global patterns
Energy consumption per person is highest in rich countries and oil producers (USA, Canada, Gulf states) and lowest in low-income countries where many people still use wood and charcoal. Global demand is rising because of population growth, industrialisation and rising living standards (especially in China and India).
## Evaluating energy sources
| Source | For | Against |
| Fossil fuels | Cheap, reliable, existing infrastructure | Limited supplies, greenhouse gases, acid rain, oil spills |
| Nuclear | High output, low CO~2~ | Radioactive waste, risk of accidents (Chernobyl, Fukushima), high building cost |
| HEP | Reliable, no emissions in use | Dams flood land, displace people, changes river flow |
| Wind | Free and clean | Intermittent; visual and noise impact; costly |
| Solar | Free, clean, suits remote areas | Needs sunshine; panels expensive |
| Geothermal | Reliable, low emissions | Only in volcanic areas (Iceland produces most of its heat this way) |
| Biomass / biofuels | Carbon neutral in principle | Land used instead of food; deforestation |
## Energy security and mix
Countries decide their **energy mix** according to resources, cost, technology and politics. Countries without their own fossil fuels depend on imports, which affects security (e.g. Europe's use of Russian gas). Many are expanding renewables, to cut emissions and increase security.
## Energy conservation
Insulation, efficient appliances, public transport, LED lighting, and recycling reduce demand and costs. Governments use subsidies for renewables, taxes on carbon, and regulation.
!tip In "evaluate" answers give both sides for the source, then a judgement: which is best for a named country and why.`,

T("geo","g18","3.6","Water","Water supply, scarcity, and managing water sustainably.",3,
["Describe sources of water supply","Explain the causes and impacts of water shortage","Describe water stress and scarcity","Evaluate large water-management schemes","Describe ways of using water sustainably"],
`## Water supply
Sources: rivers and lakes, **reservoirs** behind dams, **groundwater** from aquifers (pumped via wells and boreholes), desalination of seawater, and rainwater harvesting. Uses: domestic, agriculture (the largest use globally), industry and energy.
## Water scarcity and stress
- **Physical scarcity**: there is not enough water in the area (deserts, drought)
- **Economic scarcity**: water exists but there is no money or infrastructure to supply it (parts of sub-Saharan Africa)
- **Water stress**: when demand exceeds supply
Causes: low rainfall and drought, population growth, increased irrigation, industry and pollution, and poor management or leaking pipes. Climate change makes patterns more unpredictable.
Impacts: crop failure and food shortages, disease from unsafe water (cholera, typhoid), time spent collecting water (often by women and girls, which affects schooling), and conflict between countries over shared rivers.
## Water management
| Strategy | Details |
| Dams and reservoirs | Store water for the dry season and generate HEP, but flood land and displace people |
| Inter-basin transfers | Move water by canal or pipe from places with a surplus to places in need |
| Desalination | Removes salt from seawater (Saudi Arabia, Israel), but expensive and energy intensive |
| Groundwater extraction | Cheap, but can lower the water table |
| Conservation | Fix leaks, water meters, drip irrigation, recycling grey water, rainwater harvesting |
| Appropriate technology | Hand pumps, sand dams, and wells in rural areas |
### Case study: The Three Gorges Dam, China
The world's largest hydroelectric dam, on the Yangtze river, completed in the early 2000s (fully operating in 2012). Benefits: large renewable electricity output, flood control, and improved river navigation. Costs: about 1.3 million people were relocated, historic sites flooded, sediment trapped, wildlife disrupted and landslide risk.
Another example: the Aswan High Dam on the Nile in Egypt, which controls flooding and supplies irrigation and electricity, but stops silt reaching farmland, and so more fertiliser is needed.
!tip For a case study of a water scheme, state: the location, what it does, who benefits, who loses and your overall judgement.`,
[["Aquifer","Underground rock that stores water"],

["Describe the impact of economic activity on the environment","Explain the causes and effects of climate change","Describe soil erosion and its causes","Describe how to reduce risk","Explain sustainable development"],
`## Economic activity and the environment
Farming, industry, energy and tourism all use resources and create waste. Problems: air pollution, water pollution, loss of habitats, soil degradation, and climate change.
## Climate change
Greenhouse gases (carbon dioxide, methane) trap heat in the atmosphere. The enhanced greenhouse effect is driven by burning fossil fuels, deforestation, and cattle and rice farming.
Evidence: rising average temperatures, melting ice, rising sea levels.
Effects: sea level rise (flooding of low-lying coasts and islands: Bangladesh, the Maldives), more extreme weather (heatwaves, floods, droughts, storms), changing farming zones, loss of biodiversity (coral bleaching), and migration.
Management: **mitigation** (cutting emissions: renewable energy, efficiency, reforestation, international agreements such as the Paris Agreement) and **adaptation** (sea defences, drought-resistant crops, water management, better planning).
## Pollution and degradation
- **Air**: from industry, traffic and burning fuels; acid rain and smog
- **Water**: from sewage, fertilisers, oil spills and chemicals
- **Soil erosion**: caused by deforestation, overgrazing and ploughing on slopes. Methods to reduce it: contour ploughing, terracing, planting trees and shelter belts.
- **Loss of biodiversity**
## Sustainable development
Development that meets the needs of the present without compromising the ability of future generations to meet their own needs.
Examples of sustainable approaches: renewable energy, recycling, selective logging, sustainable fishing quotas, ecotourism, public transport, water conservation, and fair trade.
Sustainable development depends on cooperation between governments, businesses and individuals, and agreements between countries.
!tip For "how can this be managed" questions, state a strategy, the scale (local, national, global) and the limitation: strategies often cost money or need cooperation.`,
