/* Edexcel International GCSE Biology (4BI1) - part 1 */
T("bio","b1","1","Characteristics and classification","What counts as alive, and how living things are sorted into groups.",1,
["State the seven characteristics of living organisms","Describe the main features of the five kingdoms and viruses","Use binomial names correctly","Describe features of the main vertebrate groups","Use a simple dichotomous key"],
`## What makes something alive
Every living organism shows seven characteristics. Remember them as **MRS GREN**.
- **Movement**: an action by an organism or part of it that causes a change of position or place
- **Respiration**: chemical reactions in cells that break down nutrient molecules and release energy
- **Sensitivity**: the ability to detect or sense changes in the environment and respond to them
- **Growth**: a permanent increase in size and dry mass
- **Reproduction**: the processes that make more of the same kind of organism
- **Excretion**: removal of toxic materials and waste products of metabolism from the body
- **Nutrition**: taking in materials for energy, growth and development
!tip Examiners want the definitions, not just the words. Growth must mention "permanent", and excretion is not the same as egestion (getting rid of undigested food).
## The kingdoms
| Group | Cell type | Key features | Example |
| Animals | Eukaryotic, multicellular | No cell wall or chloroplasts; feed on other organisms; store glycogen | Humans, insects |
| Plants | Eukaryotic, multicellular | Cellulose cell walls; chloroplasts; make their own food; store starch | Ferns, flowering plants |
| Fungi | Eukaryotic | Chitin cell walls; body of hyphae (or single cell); feed saprotrophically; store glycogen | Mucor, yeast |
| Protoctists | Eukaryotic, mostly single-celled | Some have chloroplasts, some do not | Amoeba, Chlorella |
| Bacteria | Prokaryotic | No nucleus; circular DNA and plasmids; cell wall; very small | Lactobacillus |
Viruses are not cells. They are a protein coat around genetic material, they are far smaller than bacteria, and they can only reproduce inside a host cell.
## Naming organisms
Scientists use the **binomial system**: two Latin names, genus then species. The genus has a capital letter, the species does not, and both are italicised or underlined: *Homo sapiens*. It gives every species one name that works in every language.
## Vertebrate groups
| Group | Skin | Reproduction | Other |
| Mammals | Hair or fur | Live young, feed on milk | Constant body temperature |
| Birds | Feathers | Hard-shelled eggs | Beak, lay eggs on land |
| Reptiles | Dry scales | Soft-shelled eggs on land | Body temperature varies |
| Amphibians | Moist, permeable | Jelly-like eggs in water | Larva then adult |
| Fish | Wet scales | Soft eggs in water | Gills, fins |
## Keys
A **dichotomous key** is a series of paired statements where each leads either to another choice or to an identification. Each question must have a clear yes/no answer based on visible features.
!mistake Do not use features that vary, like size or colour, as the first split in a key. Use features that are fixed and observable.`,
[["Binomial system","Naming of organisms using two Latin words, the genus then the species"],
["Eukaryote","An organism whose cells have a nucleus and membrane-bound organelles"],
["Prokaryote","An organism whose cells have no nucleus, such as bacteria"],
["Saprotroph","An organism that feeds on dead or decaying material by secreting enzymes and absorbing the products"],
["Hyphae","Thread-like structures that make up the body of most fungi"],
["Chitin","The tough material that makes up the cell walls of fungi"],
["Excretion","Removal of toxic materials and waste products of metabolism from the body"],
["Dichotomous key","A series of paired questions used to identify organisms"]],
[["m","Which feature is found in bacteria but NOT in animal cells?",["Cytoplasm","A cell wall","Ribosomes","A cell membrane"],1,"Animal cells have no cell wall. Bacteria, plants and fungi do."],
["m","A fungus feeds by secreting enzymes onto dead material and absorbing the products. This is called",["Photosynthesis","Parasitism","Saprotrophic nutrition","Ingestion"],2,"Saprotrophs digest food outside their bodies."],
["m","Which pair shows a correctly written binomial name?",["homo Sapiens","Homo sapiens","HOMO SAPIENS","Homo Sapiens"],1,"Genus with a capital letter, species with a lowercase letter."],
["s","Describe two features that fungi and plants have in common.",2,["Both have cell walls","Both are eukaryotic / have a nucleus","Both have vacuoles / are non-motile (accept any two correct)"]],

T("bio","b2","2","Cells and microscopy","Cell structure, specialisation, levels of organisation and how to calculate magnification.",2,
["Describe the functions of the main cell structures in animal and plant cells","Compare plant and animal cells","Explain how specialised cells are adapted to their function","Calculate magnification and actual size","Describe the hierarchy from cell to organism"],
`## Cell structures
!fig cell
| Structure | Found in | Function |
| Nucleus | Animal, plant | Contains DNA; controls the activities of the cell |
| Cytoplasm | Both | Gel-like fluid where most chemical reactions happen |
| Cell membrane | Both | Controls what enters and leaves the cell |
| Mitochondria | Both | Site of aerobic respiration, releasing energy |
| Ribosomes | Both | Make proteins |
| Cell wall | Plant (also fungi, bacteria) | Made of cellulose in plants; supports the cell |
| Chloroplasts | Plant | Contain chlorophyll for photosynthesis |
| Permanent vacuole | Plant | Filled with cell sap; keeps the cell firm |
## Specialised cells
Cells become specialised through **differentiation**. Their shape and contents suit their job.
- **Red blood cell**: biconcave disc for large surface area, no nucleus so more room for haemoglobin
- **Root hair cell**: long extension gives a large surface area to absorb water and mineral ions
- **Palisade cell**: packed with chloroplasts, positioned near the top of the leaf
- **Sperm cell**: tail to swim, many mitochondria for energy, acrosome with enzymes
- **Nerve cell (neurone)**: long and thin, carries electrical impulses
## Levels of organisation
Cell → tissue → organ → organ system → organism. A tissue is a group of similar cells doing one job (muscle tissue). An organ is made of several tissues (stomach). An organ system is a group of organs working together (digestive system).
## Microscopes and magnification
**Magnification = image size ÷ actual size**
!eg A cell measures 30 mm in a drawing. The magnification is ×600. Actual size = 30 ÷ 600 = 0.05 mm = 50 μm.
Units: 1 mm = 1000 μm. Always convert to the same unit before you calculate.
!tip Use the rearrangement triangle: I over A and M. Write the units in each line of working.
!mistake A drawing should have clean, continuous lines, no shading, and be at least half the page. Label lines must not cross, and should end exactly on the structure.`,
[["Differentiation","The process by which a cell becomes specialised for a particular job"],
["Tissue","A group of similar cells working together to do the same job"],
["Organ","A structure made of several tissues working together"],
["Mitochondria","Organelles where aerobic respiration releases energy"],
["Chloroplast","Organelle containing chlorophyll where photosynthesis takes place"],
["Ribosome","Tiny structure where proteins are made"],
["Magnification","How many times larger an image is than the real object: image size ÷ actual size"],
["Cell sap","The solution of sugars and salts inside a plant vacuole"]],
[["m","Which structure is found in plant cells but NOT in animal cells?",["Mitochondria","Nucleus","Chloroplast","Ribosome"],2,"Chloroplasts are only in plant cells (and algae)."],
["m","A cell has an actual length of 0.02 mm. In a photograph it measures 40 mm. What is the magnification?",["×80","×800","×2000","×0.0005"],2,"40 ÷ 0.02 = 2000."],
["m","Which is the correct order of organisation, smallest to largest?",["Organ, tissue, cell, system","Cell, tissue, organ, system","Tissue, cell, system, organ","Cell, organ, tissue, system"],1,"Cell → tissue → organ → organ system."],
["s","Explain how a root hair cell is adapted for its function.",3,["Long extension / hair increases surface area","For faster absorption of water and mineral ions","Many mitochondria to release energy for active transport (thin wall also accepted)"]],
["s","A student measures a cell as 12 mm on a diagram with magnification ×400. Calculate the real size in μm.",3,["Actual = image ÷ magnification = 12 ÷ 400","= 0.03 mm","= 30 μm (unit conversion ×1000 for the mark)"]]]);

T("bio","b3","2","Movement of substances","Diffusion, osmosis and active transport, with the potato core practical.",2,
["Define diffusion, osmosis and active transport","Explain factors that affect the rate of diffusion","Predict what happens to plant and animal cells in different solutions","Describe the potato osmosis investigation","Explain why active transport needs energy"],
`## Diffusion
**Diffusion** is the net movement of particles from a region of higher concentration to a region of lower concentration, down a concentration gradient. It is passive, so it needs no energy from the cell.
Factors that speed it up:
- A steeper concentration gradient
- A higher temperature (particles move faster)
- A larger surface area
- A shorter diffusion distance (thin membrane)
Examples: oxygen moving from alveoli into blood, carbon dioxide moving into a leaf, digested food moving out of the small intestine.
## Osmosis
**Osmosis** is the net movement of water molecules from a dilute solution to a more concentrated solution through a partially permeable membrane. (Dilute solution = high water potential.)
| Cell | In pure water | In concentrated solution |
| Plant | Water enters, becomes **turgid** (firm) | Water leaves, becomes **flaccid**, then plasmolysed |
| Animal (red blood cell) | Takes in water, swells and may burst | Loses water, shrinks and shrivels |
## Active transport
**Active transport** moves substances from a lower to a higher concentration, against the concentration gradient. It needs energy from respiration and uses carrier proteins in the membrane. Root hair cells use it to absorb mineral ions from soil, and the small intestine uses it to absorb glucose.
!key Cells that do a lot of active transport have lots of mitochondria.
## Core practical: osmosis in potato
1. Cut potato into identical cylinders and measure their mass
2. Place one in each of several sucrose solutions of different concentration, with distilled water as one of them
3. Leave for the same time (e.g. 30 minutes) at the same temperature
4. Remove, blot dry, and measure the mass again
5. Calculate **percentage change in mass** = (final − initial) ÷ initial × 100
6. Plot % change against concentration. Where the line crosses zero the potato and solution are balanced.
!tip Independent variable: sucrose concentration. Dependent variable: percentage change in mass. Control: potato size, volume of solution, time, temperature, same type of potato.
!mistake Do not say that water "moves to where there's more water". Say water moves from a dilute solution to a more concentrated solution.`,
[["Diffusion","Net movement of particles from a higher to a lower concentration, down a concentration gradient"],
["Osmosis","Net movement of water molecules from a dilute to a more concentrated solution through a partially permeable membrane"],
["Active transport","Movement of substances against a concentration gradient using energy from respiration"],
["Concentration gradient","The difference in concentration between two regions"],
["Turgid","A plant cell that is firm because it is full of water"],
["Flaccid","A plant cell that is limp because it has lost water"],
["Plasmolysis","When the cell membrane pulls away from the cell wall due to water loss"],
["Partially permeable membrane","A membrane that lets some molecules through but not others"]],
[["m","A red blood cell is placed in distilled water. What happens?",["It shrinks","It stays the same","It swells and may burst","It becomes turgid"],2,"Water moves in by osmosis. Animal cells have no cell wall to stop them bursting."],
["m","Which process needs energy from respiration?",["Diffusion","Osmosis","Active transport","Evaporation"],2,"Active transport moves substances against the gradient."],
["m","A potato cylinder gains mass in solution X. This shows solution X is",["More concentrated than the potato cells","The same concentration as the potato cells","More dilute than the potato cells","A strong sugar solution"],2,"Water entered the potato, so the solution was more dilute."],
["s","Explain why root hair cells have many mitochondria.",3,["Mitochondria release energy by respiration","Energy is needed for active transport","To absorb mineral ions against a concentration gradient"]],
["s","Describe how you would find the concentration of the potato cell sap.",4,["Place equal potato cylinders in a range of concentrations","Measure mass before and after, same time and temperature","Calculate % change in mass","Plot graph and read concentration where % change is 0"]]]);

T("bio","b4","2","Biological molecules and enzymes","Carbohydrates, proteins, lipids, the food tests, and how enzymes work.",2,
["Name the elements and building blocks of the main food molecules","Carry out and interpret the food tests","Describe the lock and key model","Explain the effect of temperature and pH on enzymes","Describe the digestive enzymes and their substrates"],
`## The three main food molecules
| Molecule | Elements | Building blocks | Examples |
| Carbohydrates | C, H, O | Simple sugars such as glucose | Starch, glycogen, cellulose |
| Proteins | C, H, O, N (some S) | Amino acids | Enzymes, haemoglobin, collagen |
| Lipids | C, H, O | 3 fatty acids + 1 glycerol | Fats, oils |
## Food tests
| Test | Reagent | Positive result |
| Starch | Iodine solution | Orange-brown to blue-black |
| Reducing sugar | Benedict's solution, heat in water bath | Blue to green, yellow, orange, brick-red |
| Protein | Biuret solution | Blue to purple / lilac |
| Lipid | Ethanol, then add water | Cloudy white emulsion |
| Vitamin C | DCPIP | Blue to colourless |
!tip For Benedict's, the colour depends on the amount of sugar. Green is a little, brick-red is a lot. A "negative" result stays blue.
## Enzymes
Enzymes are **biological catalysts**. They are proteins that speed up reactions without being used up. Each enzyme has an **active site** that fits only one substrate. This is the **lock and key model**: the substrate binds to the active site, the reaction happens, and the products leave.
Temperature: the rate rises as particles gain energy and collide more often. Above the **optimum** the active site changes shape and the enzyme is **denatured** and cannot work.
pH: each enzyme has an optimum pH. Pepsin works best at about pH 2, amylase at about pH 7. Extremes of pH also denature enzymes.
## Digestive enzymes
| Enzyme | Substrate | Products | Made in |
| Amylase | Starch | Maltose | Salivary glands, pancreas |
| Protease | Protein | Amino acids | Stomach, pancreas, small intestine |
| Lipase | Lipid | Fatty acids and glycerol | Pancreas, small intestine |
Catalase breaks down hydrogen peroxide into water and oxygen.
## Core practical: effect of pH on amylase
Mix starch, buffer and amylase. Every 30 seconds take a drop and test it with iodine on a spotting tile. The time taken for iodine to stop turning blue-black is the time for the starch to be broken down. Repeat at different pH values.
!mistake Enzymes are not "killed" by heat. They are denatured because their shape changes.`,

["Active site","The part of an enzyme where the substrate binds"],
["Substrate","The substance an enzyme acts upon"],
["Denatured","When an enzyme's shape changes so the substrate no longer fits the active site"],
["Optimum","The temperature or pH at which an enzyme works fastest"],
["Amylase","Enzyme that breaks down starch into maltose"],
["Protease","Enzyme that breaks down proteins into amino acids"],
["Lipase","Enzyme that breaks down lipids into fatty acids and glycerol"]],
[["m","Which colour change shows protein is present with Biuret solution?",["Blue to brick-red","Orange-brown to blue-black","Blue to purple","Blue to colourless"],2,"Biuret turns purple/lilac with protein."],
["m","What are the products of the digestion of lipids?",["Amino acids","Glucose","Fatty acids and glycerol","Maltose"],2,"Lipase breaks lipids into fatty acids and glycerol."],
["m","An enzyme stops working at 70 °C. The best explanation is that",["The enzyme has died","The substrate has evaporated","The active site has changed shape","The enzyme has been used up"],2,"High temperature denatures the enzyme."],
["s","Describe how you would test a food sample for reducing sugars.",3,["Add Benedict's solution","Heat in a water bath","Positive: blue turns green/yellow/orange/brick-red"]],
["s","Explain why the rate of an enzyme-catalysed reaction decreases above the optimum temperature.",3,["Bonds in the enzyme break / shape changes","Active site changes shape","Substrate no longer fits so enzyme is denatured"]]]);

T("bio","b5","2","Plant nutrition and transport","Photosynthesis, leaf structure, limiting factors, and how plants move water and sugars.",2,
["Write the word and symbol equation for photosynthesis","Describe leaf adaptations for photosynthesis","Interpret graphs of limiting factors","Explain the roles of nitrate and magnesium ions","Describe xylem, phloem and transpiration"],
`## Photosynthesis
Plants make glucose using light energy absorbed by chlorophyll.
**carbon dioxide + water → glucose + oxygen** (light, chlorophyll)
6CO~2~ + 6H~2~O → C~6~H~12~O~6~ + 6O~2~
Glucose is used for respiration, stored as starch, converted to cellulose for cell walls, and combined with nitrate ions to make amino acids and proteins. Lipids are stored in seeds.
## Leaf structure
- **Waxy cuticle**: reduces water loss
- **Upper epidermis**: transparent, lets light through
- **Palisade mesophyll**: lots of chloroplasts, main site of photosynthesis
- **Spongy mesophyll**: air spaces for gas diffusion
- **Stomata and guard cells**: let CO~2~ in and O~2~ out; control water loss
- **Vascular bundle**: xylem brings water, phloem takes sugars away
## Limiting factors
The factor in shortest supply limits the rate. The three are **light intensity**, **carbon dioxide concentration** and **temperature**. On a graph, the rate rises then plateaus. At the plateau another factor is limiting.
!tip When asked what limits the rate at the flat part of a graph, name a factor that has not been changed on the axis, usually temperature or carbon dioxide.
## Mineral ions
- **Nitrate** is needed for amino acids and proteins. A shortage causes stunted growth and yellow older leaves.
- **Magnesium** is needed to make chlorophyll. A shortage causes yellow leaves (chlorosis).
## Transport in plants
| Tissue | Transports | Direction | Structure |
| Xylem | Water and mineral ions | Roots up to leaves | Dead, hollow tubes strengthened with lignin |
| Phloem | Sucrose and amino acids | Up and down (translocation) | Living cells with sieve plates |
**Transpiration** is the loss of water vapour from the leaves, mainly through stomata. Water evaporates from the mesophyll cells, which pulls more water up the xylem in a continuous stream. It is faster in high light, high temperature, low humidity and wind.
## Core practical: starch in a leaf
Boil the leaf in water to kill it, then in ethanol (in a water bath, away from flames) to remove chlorophyll. Rinse and add iodine. Blue-black means starch, so photosynthesis has taken place.
!mistake Plants do not "breathe in carbon dioxide and breathe out oxygen" instead of respiring. They respire all the time, and photosynthesise only when there is light.`,
[["Photosynthesis","Process in which plants use light energy to make glucose from carbon dioxide and water"],
["Chlorophyll","Green pigment that absorbs light energy for photosynthesis"],
["Limiting factor","The factor in shortest supply that restricts the rate of a process"],
["Stomata","Pores in the leaf surface that let gases in and out"],

`## A balanced diet
| Nutrient | Source | Use in the body |
| Carbohydrate | Bread, rice, potatoes | Energy |
| Protein | Meat, fish, eggs, beans | Growth and repair |
| Lipid | Butter, oils, nuts | Energy store, insulation, cell membranes |
| Vitamin A | Carrots, liver | Vision |
| Vitamin C | Citrus fruits | Healthy skin and gums |
| Vitamin D | Oily fish, sunlight | Absorbs calcium |
| Calcium | Milk, cheese | Bones and teeth |
| Iron | Red meat, spinach | Haemoglobin |
| Fibre | Vegetables, wholegrain | Helps peristalsis |
| Water | Drinks, food | Solvent, reactions |
Deficiency diseases: **scurvy** (vitamin C), **rickets** (vitamin D or calcium), **anaemia** (iron), **kwashiorkor** (protein).
Energy needs depend on age, activity, sex, and pregnancy. Estimate the energy in food by burning it under water and measuring the temperature rise: energy = mass of water × 4.2 × temperature change.
## The digestive system
- **Mouth**: teeth break up food (physical digestion); salivary amylase starts starch digestion
- **Oesophagus**: **peristalsis** pushes food down by wave-like muscle contractions
- **Stomach**: churns food, produces pepsin (a protease) and hydrochloric acid (pH about 2, kills bacteria)
- **Liver**: makes bile. **Gall bladder** stores it.
- **Pancreas**: makes amylase, protease and lipase
- **Small intestine**: final digestion and absorption of nutrients
- **Large intestine**: absorbs water. Faeces leave through the anus.
## Bile
Bile is alkaline. It neutralises stomach acid so that enzymes in the small intestine can work, and it **emulsifies** fat into tiny droplets. This gives a larger surface area for lipase.
## The villus
The wall of the small intestine is covered in villi, with
- a huge surface area
- a wall one cell thick for short diffusion distance
- a dense network of capillaries to carry food away and maintain the gradient
- a lacteal to absorb fatty acids and glycerol
!tip For adaptation answers use three parts: the feature, what it does, and the benefit (e.g. "thin wall, so short diffusion distance, so faster absorption").`,

`## Respiration
Respiration is the chemical reactions in cells that break down nutrient molecules and release energy. It happens in every living cell, all the time.
**Aerobic:** glucose + oxygen → carbon dioxide + water (+ energy)
C~6~H~12~O~6~ + 6O~2~ → 6CO~2~ + 6H~2~O
**Anaerobic in muscles:** glucose → lactic acid (+ a little energy)
**Anaerobic in yeast:** glucose → ethanol + carbon dioxide (+ a little energy)
Anaerobic respiration releases much less energy per glucose molecule. In exercise, lactic acid builds up and causes an **oxygen debt**: extra oxygen needed afterwards to break down the lactic acid, which is why you keep panting after sprinting.
## Breathing
| | Inhaling | Exhaling |
| Intercostal muscles | Contract, ribs move up and out | Relax, ribs move down and in |
| Diaphragm | Contracts and flattens | Relaxes and domes upward |
| Chest volume | Increases | Decreases |
| Pressure | Falls below atmospheric | Rises above atmospheric |
Air moves in because pressure inside the chest is lower than outside, and out when it is higher.
## Gas exchange in the alveoli
Alveoli have a large surface area (millions), thin walls (one cell thick), moist surfaces, and a good blood supply from capillaries. Breathing and blood flow keep the concentration gradients steep.
| Gas | Inhaled air | Exhaled air |
| Oxygen | 21% | 16% |
| Carbon dioxide | 0.04% | 4% |
Limewater turns cloudy with carbon dioxide.
## Exercise
During exercise muscles respire faster. Breathing rate and depth increase, and the heart beats faster, to deliver more oxygen and remove carbon dioxide.
## Smoking
- **Tar**: causes cancer and coats the lining of the airways
- **Carbon monoxide**: binds to haemoglobin, reducing oxygen carried
- **Nicotine**: addictive; raises heart rate and blood pressure
- Damages cilia and alveoli, causing bronchitis and emphysema
!mistake Do not write that we "breathe in oxygen and breathe out carbon dioxide" as the whole story. Exhaled air still has 16% oxygen.`,

`## Blood
| Component | Function |
| Plasma | Carries dissolved glucose, amino acids, CO~2~, urea, hormones, heat |
| Red blood cells | Carry oxygen as oxyhaemoglobin. Biconcave, no nucleus |
| White blood cells | Defend against pathogens. Phagocytes engulf them; lymphocytes make antibodies |
| Platelets | Fragments of cells that help blood clot |
## Blood vessels
| Vessel | Wall | Lumen | Other |
| Artery | Thick, muscular, elastic | Narrow | Carries blood away from the heart at high pressure |
| Vein | Thin | Wide | Valves stop backflow; blood at low pressure |
| Capillary | One cell thick | Very narrow | Exchange of materials with tissues |
## The heart
The heart is a double pump. The right side pumps deoxygenated blood to the lungs and the left pumps oxygenated blood to the body, so blood passes through the heart twice per circuit.
1. Vena cava → right atrium
2. Right ventricle → pulmonary artery → lungs
3. Pulmonary vein → left atrium
4. Left ventricle → aorta → body
The left ventricle wall is thicker because it pumps blood around the whole body. **Valves** keep the blood going one way. Heart muscle is supplied with oxygen by the **coronary arteries**.
## Coronary heart disease
Fatty deposits build up in the coronary arteries and narrow them. Less blood and oxygen reaches the heart muscle, and a blockage causes a heart attack. Risk factors: a diet high in saturated fat, smoking, high blood pressure, stress, lack of exercise, genetics.
## Exercise and the heart
Heart rate rises during exercise to deliver more oxygen and glucose to muscles and remove carbon dioxide. Fitter people have a lower resting rate and recover faster.
!tip In a heart diagram question, the left and right sides are drawn as if you are looking at the person from the front, so the right side of the diagram is the person's left.`,

T("bio","b9","2","Excretion and homeostasis","Kidneys, urea, and how the body keeps temperature and blood glucose steady.",2,

`## Excretion
Excretion is the removal of toxic materials and waste products of metabolism. Main products: **carbon dioxide** (lungs), **urea** (kidneys, in urine) and **water** (kidneys, lungs, skin).
Urea is made in the liver from excess amino acids (**deamination**) and carried in the blood to the kidneys.
## The kidney
Each kidney contains about a million nephrons.
1. **Ultrafiltration**: blood is forced under high pressure into the nephron. Water, glucose, urea and salts pass out. Blood cells and large proteins stay in.
2. **Selective reabsorption**: all the glucose, some water and some ions are taken back into the blood.
3. What is left (urea, excess water and salts) leaves as **urine**.
The hormone **ADH** controls water reabsorption. When the blood is too concentrated, more ADH is released, so more water is reabsorbed and a small amount of concentrated urine is produced.
## Homeostasis
**Homeostasis** is the maintenance of a constant internal environment. It uses **negative feedback**: a change is detected and the response reverses it.
### Temperature (about 37 °C)
| If too hot | If too cold |
| Sweat evaporates and cools skin | Shivering releases heat from respiration |
| **Vasodilation**: arterioles widen, more blood flows near the surface, more heat lost | **Vasoconstriction**: arterioles narrow, less heat lost |
| | Sweating stops |
The **hypothalamus** in the brain monitors blood temperature and coordinates the response.
### Blood glucose
After a meal glucose rises, and the pancreas releases **insulin**. The liver converts glucose to glycogen, so blood glucose falls. When glucose falls too low, the pancreas releases **glucagon**, and the liver converts glycogen back to glucose.
- **Type 1 diabetes**: the pancreas does not produce enough insulin. Treated with insulin injections and diet.
- **Type 2 diabetes**: cells stop responding to insulin. Managed by diet, exercise and sometimes drugs.
!mistake Vasoconstriction/vasodilation: it is the arterioles that change width, not the capillaries, and blood vessels do not move closer to the skin.`,

`## The nervous system
The **central nervous system (CNS)** is the brain and spinal cord. Receptors detect **stimuli**, sensory neurones carry impulses to the CNS, and motor neurones carry impulses to **effectors** (muscles and glands), which produce a response.
## Reflex arc
A **reflex** is a fast, automatic, protective response.
stimulus → receptor → sensory neurone → relay neurone (in spinal cord) → motor neurone → effector → response
Neurones do not touch. At a **synapse** there is a tiny gap. An impulse triggers release of a chemical **neurotransmitter**, which diffuses across and starts a new impulse in the next neurone.
## The eye
| Part | Function |
| Cornea | Refracts light into the eye |
| Iris | Controls the size of the pupil |
| Lens | Focuses light onto the retina |
| Retina | Contains light receptors (rods and cones) |
| Optic nerve | Carries impulses to the brain |
| Ciliary muscles and suspensory ligaments | Change the shape of the lens |
**Pupil reflex:** in bright light the circular muscles of the iris contract and the pupil gets smaller, protecting the retina. In dim light the radial muscles contract and the pupil widens.
**Focusing:** for a near object the ciliary muscles contract, the suspensory ligaments slacken and the lens becomes thicker and rounder. For a distant object the opposite happens.
## Hormones
Hormones are chemicals made in endocrine glands and carried in the blood to target organs.
| | Nervous | Hormonal |
| Carried by | Neurones | Blood |
| Speed | Very fast | Slower |
| Duration | Short | Longer |
Adrenaline prepares the body for fight or flight: increased heart rate, breathing rate, and glucose released from the liver.
## Plant responses
Plants respond to stimuli by growing. This is a **tropism**.
- **Phototropism**: shoots grow towards light (positive)
- **Gravitropism**: roots grow downwards (positive), shoots grow upwards (negative)
Plant hormones called **auxins** are made in the shoot tip. Auxin moves to the shaded side and makes cells there elongate more, so the shoot bends towards light.
!tip The reflex arc order is a favourite. Learn it as a sentence: Stimulus, Receptor, Sensory, Relay, Motor, Effector, Response.`,

`## Types of reproduction
| | Asexual | Sexual |
| Parents | One | Two |
| Offspring | Genetically identical (clones) | Genetically different |
| Gametes | None | Fusion of male and female gametes |
| Advantage | Fast, no mate needed | Variation helps survival |
Examples of asexual reproduction: bacteria dividing, strawberry runners, potato tubers.
## Flowers
- **Sepal**: protects the bud
- **Petal**: attracts insects (large and colourful in insect-pollinated flowers)
- **Stamen** (anther + filament): makes pollen
- **Carpel** (stigma + style + ovary): the female part. The ovary contains **ovules**.
Insect-pollinated flowers have sticky pollen and nectaries; wind-pollinated flowers have small petals, feathery stigmas and large light pollen.
**Pollination** is transfer of pollen from anther to stigma. **Fertilisation**: pollen tube grows down the style and the male nucleus fuses with the ovule nucleus. The ovule becomes the seed and the ovary becomes the fruit.
**Germination** needs water, oxygen and a suitable temperature. Light is not needed.
## Human reproduction
Male: testes (make sperm and testosterone), sperm duct, prostate gland, urethra, penis.
Female: ovaries (make eggs), oviduct (fertilisation happens here), uterus (embryo develops), cervix, vagina.
After fertilisation the zygote divides to form an embryo, which implants in the uterus lining. The **placenta** allows exchange of oxygen and nutrients (mother to baby) and carbon dioxide and urea (baby to mother) without the bloods mixing. The **amniotic fluid** protects the fetus.
## Menstrual cycle
About 28 days. Ovulation occurs around day 14.
- **FSH** (pituitary) causes a follicle to develop and makes the ovary release oestrogen
- **Oestrogen** repairs the uterus lining and stimulates LH release
- **LH** causes ovulation
- **Progesterone** maintains the lining. If there is no pregnancy it falls and menstruation starts.
## Puberty and STIs
Testosterone causes male secondary sexual characteristics (facial hair, voice breaking). Oestrogen causes female ones (breast development, hips widen).
**HIV** is a virus spread by unprotected sex, sharing needles, or from mother to baby. It damages white blood cells and may lead to AIDS. Condoms reduce risk.`,

`## DNA, genes, chromosomes
DNA is a double helix of two strands held together by pairs of bases: **A pairs with T, C pairs with G**. A **gene** is a section of DNA that codes for a protein, and each three bases (a triplet) codes for one amino acid. A **chromosome** is a long molecule of DNA. Humans have 46 chromosomes (23 pairs) in body cells and 23 in gametes.
Protein synthesis: DNA in the nucleus is copied into mRNA, which travels to a ribosome where amino acids are joined in the correct order.
## Cell division
| | Mitosis | Meiosis |
| Produces | 2 identical cells | 4 different cells |
| Chromosome number | Stays the same (diploid) | Halves (haploid) |
| Used for | Growth, repair, asexual reproduction | Making gametes |
## Genetic terms
- **Allele**: a different version of a gene
- **Dominant**: shows in the phenotype even if only one copy is present (capital letter)
- **Recessive**: only shows if two copies are present (lowercase)
- **Genotype**: the alleles an organism has. **Phenotype**: the observable characteristic
- **Homozygous**: two identical alleles. **Heterozygous**: two different alleles
## Monohybrid crosses
!eg Cross two heterozygous parents, Tt × Tt (tall is dominant). Gametes: T or t from each. Offspring: TT, Tt, Tt, tt. Genotype ratio 1 TT : 2 Tt : 1 tt. Phenotype ratio 3 tall : 1 short, so 75% tall.
Always show: parents' genotypes, gametes, a Punnett square, offspring genotypes and phenotypes.
## Sex determination
Females are XX and males XY. The father's sperm decides the sex of the baby. The probability of a boy or girl is always 50%.
## Genetic disorders
- **Cystic fibrosis**: recessive. Thick mucus in lungs and gut. Both parents can be carriers (Cc) with a 25% chance of an affected child.
- **Sickle cell anaemia**: recessive. Misshaped red blood cells carry less oxygen. Carriers are protected against malaria.
!tip In a family tree, if two unaffected parents have an affected child, the condition must be recessive and both parents are carriers.
!mistake Probability applies to each child separately. Two children already being girls does not change the chance of the next being a boy.`,

T("bio","b13","3","Variation and evolution","Mutation, natural selection, antibiotic resistance and the evidence for evolution.",3,
["Distinguish genetic and environmental variation","Describe mutation and its causes","Explain evolution by natural selection","Explain how bacteria become antibiotic resistant","Describe evidence for evolution"],
`## Variation
Differences between individuals of the same species is **variation**. It can be:
- **Genetic**: caused by different alleles, e.g. blood group, eye colour
- **Environmental**: caused by conditions, e.g. scars, language, plant growth in shade
- **Both**: height and weight depend on genes and diet
**Continuous variation** shows a range of values (height). **Discontinuous variation** falls into distinct categories (blood group).
## Mutation
A **mutation** is a random change in the DNA of a gene or chromosome. Most are harmless, some are harmful and a few are beneficial. The rate increases with ionising radiation (X-rays, UV, gamma) and some chemicals (tar, called **mutagens**). It produces new alleles.
## Natural selection
1. Individuals in a population show variation
2. More offspring are produced than can survive
3. There is a struggle for survival (competition, predation, disease)
4. Individuals with advantageous characteristics are more likely to survive and reproduce
5. They pass on the alleles that gave the advantage
6. Over many generations the frequency of those alleles increases
!tip Always say "pass on the alleles", not "pass on the characteristic" or "adapt". Individuals do not change. Populations change over generations.
## Antibiotic resistance
Antibiotics kill bacteria. By chance, a mutation may make one bacterium **resistant**. When antibiotics are used, resistant bacteria survive and reproduce, passing on the allele, until most of the population is resistant (e.g. MRSA). Reduce the problem by only prescribing antibiotics when needed and always finishing the course.
## Evidence for evolution
- **Fossils** show gradual change over time
- Similar bone structures (the pentadactyl limb) suggest a common ancestor
- DNA comparisons: more closely related species have more similar DNA
- Observed examples: peppered moths, antibiotic resistance
**Extinction** can occur because of climate change, new predators or competitors, new diseases, habitat destruction, or catastrophic events.`,

["Natural selection","Process in which individuals better adapted to their environment survive and pass on their alleles"],
["Evolution","Gradual change in the inherited characteristics of a population over many generations"],

T("bio","b14","4","Ecosystems and cycles","Food chains, energy flow, nutrient cycles, populations and sampling.",4,
["Define key ecological terms","Interpret food chains, webs and pyramids","Explain energy loss between trophic levels","Describe the carbon and nitrogen cycles","Describe quadrat and transect sampling"],
`## Key terms
- **Population**: all the organisms of one species in an area
- **Community**: all the populations in an area
- **Habitat**: where an organism lives
- **Ecosystem**: a community and its non-living environment
## Food chains and webs
Energy comes from the Sun. A food chain shows what eats what, with arrows pointing in the direction of energy flow: producer → primary consumer → secondary consumer → tertiary consumer. **Decomposers** (bacteria and fungi) break down dead material and return nutrients to the soil.
If a species is removed from a web, the populations of its prey rise and its predators fall.
## Energy transfer
Only about **10%** of the energy at one trophic level reaches the next. The rest is lost as heat from respiration, in waste (faeces and urine), in parts that are not eaten (bones, roots), and in movement. This is why food chains are short, and why eating plants is more efficient than eating meat.
Pyramids of number show the number at each level. Pyramids of biomass show dry mass. Pyramids of energy show energy transferred, and are always pyramid-shaped.
## Carbon cycle
Photosynthesis removes CO~2~ from the air. Respiration, combustion and decomposition return it. Feeding passes carbon along the food chain. Fossil fuels form from long-dead organisms.
## Nitrogen cycle
- **Nitrogen fixation**: bacteria in root nodules (and lightning) convert N~2~ to compounds
- **Nitrification**: nitrifying bacteria turn ammonium to nitrate
- **Absorption**: plants take up nitrate to build protein
- **Decomposition**: protein breaks down to ammonia
- **Denitrification**: bacteria turn nitrate back to nitrogen gas in waterlogged soil
## Sampling
A **quadrat** (e.g. 1 m^2^ frame) counts organisms in an area. Place quadrats randomly (random number tables for coordinates), take many, calculate the mean, and scale up: population = mean per quadrat × total area ÷ quadrat area. A **transect** (line across a habitat) shows change along a gradient such as a shoreline.
## Populations
Population size depends on food supply, predators, disease, competition and climate. In a predator–prey graph the peaks of the predator follow the prey's with a time lag.
!tip For energy loss questions, name two different ways energy is lost, and always link to respiration or waste.`,

`## Human population growth
The human population has risen rapidly because of improved medicine, sanitation and food supply. More people means more demand for food, land, water and energy, and more waste.
## The greenhouse effect
Gases like **carbon dioxide** and **methane** absorb infrared radiation from the Earth and re-emit it, keeping the planet warm. Human activity (burning fossil fuels, deforestation, cattle and rice fields) is increasing the levels, causing **global warming**: melting ice caps, rising sea levels, more extreme weather and changes to ecosystems.
## Other air pollution
- **Sulphur dioxide**: from burning coal, causes acid rain, which damages trees and kills aquatic life
- **Carbon monoxide**: from incomplete combustion, a toxic gas
- **CFCs**: damaged the ozone layer, increasing UV and skin cancer risk
## Water pollution and eutrophication
Sewage and fertilisers wash into rivers and lakes.
1. Nitrates cause rapid growth of algae (an **algal bloom**)
2. The algae block light, so plants below die
3. Dead material is decomposed by bacteria, which use up oxygen
4. Fish and other aquatic animals die from lack of oxygen
## Deforestation
Trees are cleared for timber, farmland and building. Effects: loss of habitats and biodiversity, more CO~2~ in the air (less photosynthesis, and burning releases it), soil erosion and flooding, and disrupted water cycle.
## Conservation
**Sustainable resources** are used at a rate that allows them to be replaced. Conservation methods: protected reserves and national parks, quotas on fishing and net mesh size, captive breeding and seed banks, education, replanting forests and recycling.
!tip Eutrophication questions give you marks for the sequence: nitrate → algal bloom → light blocked → plants die → decomposers use oxygen → animals die. Learn it in order.
!mistake The ozone layer and global warming are separate problems. CFCs thin the ozone layer; CO~2~ and methane cause the enhanced greenhouse effect.`,

T("bio","b16","5","Biological resources and biotechnology","Crops, fish farming, selective breeding, genetic engineering, cloning and fermentation.",5,

`## Food production
In glasshouses growers increase yield by controlling temperature, light and carbon dioxide levels, which are limiting factors in photosynthesis, and by using fertilisers and pesticides. Pests can also be controlled by **biological control** (introducing a natural predator).
**Fish farming:** fish are kept in controlled ponds or cages, with controlled feeding, protection from predators and disease, and selective breeding. It protects wild stocks but can cause pollution and disease.
## Selective breeding
1. Choose parents with the desired characteristics
2. Breed them together
3. Select the best offspring and breed again
4. Repeat over many generations
Used for high milk yield, disease resistance, and large fruit. It can reduce variation, so the population is vulnerable to new diseases.
## Genetic engineering
Genes are moved from one organism to another to give a useful characteristic.
Making human insulin:
1. The human insulin gene is cut out using **restriction enzymes**
2. A bacterial **plasmid** is cut with the same enzyme
3. The gene is inserted using **ligase**
4. The plasmid is put into a bacterium
5. Bacteria multiply in a fermenter and make insulin
**GM crops**, such as insect-resistant maize or Golden Rice with extra vitamin A, can give higher yields and better nutrition. Concerns include effects on wild species, unknown health impacts and cost.
## Cloning
Cloning produces genetically identical copies. In plants, **tissue culture** grows new plants from small pieces of tissue. In animals, an adult cell nucleus is placed in an egg with its nucleus removed (as in Dolly the sheep). Cloning keeps desirable features, but reduces genetic variation.
## Biotechnology and fermentation
- **Yeast** in bread: CO~2~ makes dough rise; in brewing: sugar → ethanol
- **Bacteria** (*Lactobacillus*) turn milk into yoghurt by making lactic acid
- **Fungus** (*Fusarium*) is grown to make mycoprotein
Fermenters provide the best conditions: temperature, pH, oxygen, nutrients, and are kept sterile to avoid contamination.
!tip In evaluation questions, give a benefit AND a drawback, and link them to the situation in the question.`,

T("chem","c1","1","States of matter and separation","Particle model, changes of state, pure substances and separating mixtures.",1,

`## The particle model
| | Solid | Liquid | Gas |
| Arrangement | Regular, close together | Random, close together | Random, far apart |
| Movement | Vibrate about fixed positions | Move around each other | Move quickly in all directions |
| Forces between particles | Strong | Weaker | Very weak |
| Shape / volume | Fixed shape, fixed volume | Takes shape of container, fixed volume | No fixed shape or volume |
**Melting** and **boiling** need energy to overcome forces between particles. The temperature stays constant while a substance changes state, because the energy goes into breaking the forces and not into speeding the particles up.
**Diffusion** is the spreading of particles from high to low concentration. Lighter molecules diffuse faster. In the classic experiment, ammonia and hydrogen chloride gas diffuse along a tube and a white ring of ammonium chloride forms nearer the HCl end, because HCl has the larger Mr and moves slower.
## Elements, compounds, mixtures
- **Element**: one type of atom only
- **Compound**: two or more elements chemically bonded in a fixed ratio; only separated by chemical reactions
- **Mixture**: two or more substances not chemically bonded; separated by physical methods and keeps the properties of its parts
A **pure** substance has a fixed melting and boiling point. Impurities lower the melting point and raise the boiling point, and make them occur over a range.
## Separation techniques
| Technique | Used to separate |
| Filtration | Insoluble solid from a liquid |
| Evaporation / crystallisation | Dissolved solid from a solution |
| Simple distillation | Solvent from a solution (e.g. pure water from salt water) |
| Fractional distillation | Liquids with different boiling points (ethanol and water, crude oil, air) |
| Paper chromatography | Mixtures of soluble substances such as dyes |
## Chromatography
Draw the start line in **pencil** (ink would run). The solvent rises, carrying substances different distances depending on their solubility and attraction to the paper.
**Rf = distance moved by the substance ÷ distance moved by the solvent**
Rf is always between 0 and 1. A pure substance gives a single spot. Compare Rf values or spot positions with known samples.
!mistake The start line must be above the solvent level in the beaker, or the sample will dissolve into the solvent.`,

T("chem","c2","1","Atomic structure and the periodic table","Protons, neutrons, electrons, isotopes, electronic configuration and the periodic table.",1,
["State the relative mass and charge of the subatomic particles","Calculate numbers of subatomic particles from atomic and mass numbers","Define isotopes and calculate relative atomic mass","Write electronic configurations for the first 20 elements","Link position in the periodic table to electron arrangement"],
`## Inside the atom
!fig atom
| Particle | Relative mass | Relative charge | Location |
| Proton | 1 | +1 | Nucleus |
| Neutron | 1 | 0 | Nucleus |
| Electron | very small (about 1/1840) | −1 | Shells around the nucleus |
Atoms are neutral because the number of protons equals the number of electrons.
- **Atomic number** (Z) = number of protons
- **Mass number** (A) = protons + neutrons
- Neutrons = mass number − atomic number
!eg Chlorine-35 has atomic number 17, so 17 protons, 17 electrons and 35 − 17 = 18 neutrons.
## Isotopes
**Isotopes** are atoms of the same element with the same number of protons but different numbers of neutrons. They have the same chemical properties (same electrons) but different physical properties such as density.
**Relative atomic mass** (A~r~) is the weighted mean mass of the isotopes compared with 1/12 of a carbon-12 atom.
!eg Chlorine is 75% ^35^Cl and 25% ^37^Cl. A~r~ = (75 × 35 + 25 × 37) ÷ 100 = 35.5.
## Electronic configuration
Electrons fill shells from the inside: 2, then 8, then 8. Sodium (11) is 2,8,1; chlorine (17) is 2,8,7; calcium (20) is 2,8,8,2.
## The periodic table
Elements are arranged in order of **atomic number**. **Groups** (columns) have the same number of outer-shell electrons, so similar chemical properties. The **period** (row) number is the number of shells filled.
- Metals are on the left and centre; non-metals on the right
- Metals lose electrons to form positive ions. Non-metals gain electrons to form negative ions.
- Group 0 (noble gases) have full outer shells so are unreactive
- Transition metals form coloured compounds, act as catalysts, and have variable oxidation states
!tip Group number = number of outer electrons (for groups 1–7). Period number = number of shells.`,

T("chem","c3","1","Formulae, equations and calculations","Writing formulae, balancing equations, and the mole calculations that appear in every paper.",1,
["Write formulae of ionic compounds from ion charges","Balance equations and add state symbols","Calculate relative formula mass","Use moles = mass ÷ Mr, concentration and gas volume","Calculate empirical formula and percentage yield"],
`## Formulae
Common ions to know: H^+^, Na^+^, K^+^, Ag^+^, NH~4~^+^; Mg^2+^, Ca^2+^, Cu^2+^, Fe^2+^, Zn^2+^; Al^3+^, Fe^3+^; Cl^−^, Br^−^, I^−^, OH^−^, NO~3~^−^; O^2−^, S^2−^, SO~4~^2−^, CO~3~^2−^.
Balance the charges. Aluminium sulfate: Al^3+^ and SO~4~^2−^ gives Al~2~(SO~4~)~3~.
## Equations
Balance by changing the numbers in front of formulae, never the small numbers. State symbols: (s), (l), (g), (aq).
2Mg(s) + O~2~(g) → 2MgO(s)
## Relative formula mass
M~r~ is the sum of the A~r~ values. Ca(OH)~2~ = 40 + 2 × (16 + 1) = 74.
## The mole
One mole is 6.02 × 10^23^ particles. The key equation:
**moles = mass (g) ÷ M~r~**
!eg Moles in 11 g of CO~2~: M~r~ = 44, so 11 ÷ 44 = 0.25 mol.
## Reacting masses
1. Write the balanced equation
2. Work out moles of the substance you know
3. Use the equation ratio to find moles of the other substance
4. Convert to mass using mass = moles × M~r~
## Concentration and gas volume
- **concentration (mol/dm^3^) = moles ÷ volume (dm^3^)**; 1 dm^3^ = 1000 cm^3^
- **concentration (g/dm^3^) = mass ÷ volume (dm^3^)**
- **Volume of gas (dm^3^) = moles × 24** at room temperature and pressure
## Empirical formula
Divide the mass (or % ) of each element by its A~r~, then divide by the smallest result to get the simplest whole-number ratio.
!eg 2.4 g of carbon and 0.6 g of hydrogen. Moles C = 0.2, H = 0.6. Divide by 0.2: 1 : 3. Empirical formula CH~3~.
The **molecular formula** is a whole-number multiple of the empirical formula: divide the M~r~ by the empirical formula mass.
## Percentage yield
**% yield = actual yield ÷ theoretical yield × 100**
Yield is lower than 100% because of incomplete reactions, loss during transfer or filtration, and side reactions.
!tip Show every step. Marks are given for the method even if the final answer is wrong.`,

T("chem","c4","1","Ionic bonding","Ion formation, ionic lattices, dot-and-cross diagrams and properties of ionic compounds.",1,
["Explain how ions form by electron transfer","Draw dot-and-cross diagrams for simple ionic compounds","Describe the structure of an ionic lattice","Explain the properties of ionic compounds","Predict formulae using ion charges"],
`## Forming ions
Atoms form ions by gaining or losing electrons to get a full outer shell.
- **Metals lose electrons** to form positive ions (cations). Na (2,8,1) → Na^+^ (2,8).
- **Non-metals gain electrons** to form negative ions (anions). Cl (2,8,7) → Cl^−^ (2,8,8).
Group 1 forms 1+, Group 2 forms 2+, Group 6 forms 2−, Group 7 forms 1−.
## Ionic bonding
**Ionic bonding** is the strong electrostatic attraction between oppositely charged ions. It forms when electrons are transferred from a metal to a non-metal.
In a dot-and-cross diagram for sodium chloride, show Na^+^ with an empty outer shell (square brackets with charge) and Cl^−^ with 8 electrons (7 crosses plus the 1 dot). For magnesium oxide, show 2 electrons transferred and 2+/2− charges.
## Giant ionic lattice
Ionic compounds form a regular **giant lattice** of alternating positive and negative ions held together in all directions by strong forces.
## Properties
| Property | Explanation |
| High melting and boiling points | Lots of energy needed to overcome the strong electrostatic attraction in the giant lattice |
| Conduct when molten or dissolved | Ions are free to move and carry charge |
| Do not conduct as solids | Ions are held in fixed positions |
| Often soluble in water | Water molecules can pull ions out of the lattice |
| Brittle | Layers shift, like charges line up and repel, and it shatters |
!tip Magnesium oxide has a higher melting point than sodium chloride because Mg^2+^ and O^2−^ ions have bigger charges, so the attraction is stronger.
!mistake Do not say ionic compounds conduct "because electrons move". It is ions that carry the charge when molten or dissolved.`,

["Anion","A negatively charged ion"],

`## Covalent bonding
A **covalent bond** is a shared pair of electrons between two non-metal atoms. Each atom gets a full outer shell.
Diagrams to know: H~2~, Cl~2~, O~2~ (double bond), N~2~ (triple bond), HCl, H~2~O, NH~3~, CH~4~, CO~2~.
## Simple molecular substances
Small molecules with strong covalent bonds within them but weak **intermolecular forces** between molecules.
- Low melting and boiling points: little energy is needed to overcome intermolecular forces (the covalent bonds do not break)
- Do not conduct electricity: no free charged particles
- Melting and boiling points rise with molecular size
## Giant covalent structures
| Substance | Structure | Properties |
| Diamond | Each carbon bonded to 4 others in a rigid 3D lattice | Very hard, very high melting point, does not conduct |
| Graphite | Each carbon bonded to 3 others in layers; layers held by weak forces | Soft and slippery (layers slide), conducts (delocalised electrons) |
| Silicon dioxide | Each Si bonded to 4 O in a 3D lattice | Hard, high melting point, does not conduct |
**Graphene** is a single layer of graphite, very strong and an excellent conductor. **Fullerenes** (e.g. C~60~) are hollow carbon spheres or tubes, used for drug delivery and as lubricants.
## Metallic bonding
A lattice of positive metal ions in a sea of **delocalised electrons**. The strong attraction between ions and electrons is the metallic bond.
- Conduct electricity and heat: delocalised electrons carry charge and energy
- Malleable and ductile: layers of ions slide over each other without breaking the bond
- High melting points: strong metallic bonding
## Alloys
An **alloy** is a mixture of a metal with other elements. The different-sized atoms disrupt the regular layers, so it is harder to slide them and the alloy is harder than the pure metal. Examples: steel (iron + carbon), brass (copper + zinc).
!tip Never say covalent bonds "break" when a simple molecular substance melts. It is the intermolecular forces that are overcome.`,

T("chem","c6","1","Electrolysis","Molten and aqueous electrolysis, electrode equations and purifying copper.",1,
["Define electrolysis and name the electrodes","Predict products from molten compounds","Predict products from aqueous solutions","Write half-equations","Describe copper purification and electroplating"],
`## What is electrolysis?
**Electrolysis** is the breakdown of an ionic compound, molten or in solution, by passing an electric current through it. The **electrolyte** is the liquid that conducts. The **anode** is the positive electrode and the **cathode** is the negative electrode. Positive ions go to the cathode and negative ions go to the anode.
!key Remember PANIC: Positive Anode, Negative Is Cathode. Reduction occurs at the cathode (gain of electrons), oxidation at the anode (loss of electrons).
## Molten compounds
Metal at the cathode, non-metal at the anode.
Lead(II) bromide: Cathode Pb^2+^ + 2e^−^ → Pb. Anode 2Br^−^ → Br~2~ + 2e^−^.
## Aqueous solutions
Water also supplies H^+^ and OH^−^ ions.
- **Cathode**: if the metal is more reactive than hydrogen, hydrogen is produced. If less reactive (copper, silver), the metal is produced.
- **Anode**: halide ions give the halogen (Cl~2~, Br~2~, I~2~). If no halide is present, oxygen is produced from OH^−^ (4OH^−^ → 2H~2~O + O~2~ + 4e^−^).
| Electrolyte | Cathode | Anode |
| Sodium chloride (brine) | Hydrogen | Chlorine |
| Copper(II) sulfate (inert electrodes) | Copper | Oxygen |
| Dilute sulfuric acid | Hydrogen | Oxygen |
Electrolysis of brine also leaves sodium hydroxide solution. The three products (hydrogen, chlorine, sodium hydroxide) have many industrial uses: chlorine for bleach and plastics, sodium hydroxide for soap, hydrogen for margarine.
## Copper electrodes
With copper electrodes in copper sulfate, the anode dissolves (Cu → Cu^2+^ + 2e^−^) and copper is deposited on the cathode. This is used to purify copper (impure copper at the anode) and for **electroplating**.
## Tests
Hydrogen: lit splint squeaky pop. Oxygen: relights a glowing splint. Chlorine: bleaches damp litmus paper.
!tip In half-equations, always balance both the atoms and the charge, and write electrons on the correct side.`,

T("chem","c7","2","Group 1 and Group 7","Alkali metals, halogens, displacement reactions and trends.",2,
["Describe the reactions of lithium, sodium and potassium with water","Explain the trend in reactivity in Group 1","Describe the physical properties of halogens","Explain halogen displacement reactions","Explain the trend in reactivity in Group 7"],
`## Group 1: the alkali metals
Lithium, sodium and potassium are soft metals with low density (Li, Na and K float). They have low melting points, and react quickly with air, so are stored under oil. They form **1+ ions**.
Reaction with water: metal + water → metal hydroxide + hydrogen
2Na + 2H~2~O → 2NaOH + H~2~
- Lithium fizzes steadily
- Sodium melts into a ball and darts around
- Potassium reacts violently and burns with a lilac flame
The solution is **alkaline** (universal indicator turns purple) because of the hydroxide ions.
!key Reactivity **increases** down Group 1. The outer electron is further from the nucleus and is more shielded, so it is lost more easily.
## Group 7: the halogens
| Halogen | Colour | State at room temperature |
| Chlorine | Pale green | Gas |
| Bromine | Red-brown | Liquid |
| Iodine | Grey-black solid (purple vapour) | Solid |
They exist as **diatomic molecules** (Cl~2~, Br~2~, I~2~). Melting and boiling points **increase** down the group because of stronger intermolecular forces in larger molecules. They form **1− ions** (halides).
## Displacement
A more reactive halogen displaces a less reactive halide from its salt solution.
Cl~2~ + 2KBr → 2KCl + Br~2~ (the solution turns orange)
Chlorine will displace bromide and iodide; bromine will displace iodide only; iodine displaces neither.
!key Reactivity **decreases** down Group 7. An incoming electron is closer to the nucleus and less shielded, so it is attracted more strongly in fluorine and chlorine.
## Compounds
Halogens react with metals to form ionic salts (2Na + Cl~2~ → 2NaCl). With hydrogen they form hydrogen halides (HCl), which dissolve in water to make acids.
!tip Don't mix up the two trends: Group 1 gets MORE reactive down the group; Group 7 gets LESS reactive down the group.`,

T("chem","c8","2","Gases in the atmosphere","Composition of air, oxygen in reactions, rusting and carbon dioxide in the atmosphere.",2,
["State the composition of dry air","Describe how oxygen content is measured","Describe oxide formation and acid and basic oxides","Explain the conditions for rusting","Explain the greenhouse effect and climate change"],
`## Composition of dry air
| Gas | Percentage |
| Nitrogen | about 78% |
| Oxygen | about 21% |
| Argon | about 0.9% |
| Carbon dioxide | about 0.04% |
Air also contains variable amounts of water vapour. Air is separated into its gases by **fractional distillation** of liquid air, since nitrogen, oxygen and argon have different boiling points.
## Measuring the percentage of oxygen
Copper heated in a fixed volume of air in a gas syringe removes oxygen: 2Cu + O~2~ → 2CuO. The volume decreases by about one fifth, about 21%.
## Reactions with oxygen
- **Metals** burn to form basic oxides: magnesium burns with a bright white flame (2Mg + O~2~ → 2MgO)
- **Non-metals** burn to form acidic oxides: sulfur burns with a blue flame to form SO~2~, carbon forms CO~2~
Acidic oxides dissolve in water to form acid solutions (pH below 7). Basic oxides that dissolve (alkalis) form pH above 7.
## Rusting
Rusting is the oxidation of iron and needs **both oxygen and water**.
4Fe + 3O~2~ + 2xH~2~O → 2Fe~2~O~3~.xH~2~O
Prevention: painting, oiling, galvanising (zinc coating), or sacrificial protection using a more reactive metal.
## Carbon dioxide and climate
Carbon dioxide is released by burning fossil fuels, and by respiration. It is removed by photosynthesis and dissolving in oceans. The balance has been disrupted by burning fossil fuels and deforestation. CO~2~ and methane are **greenhouse gases**: they absorb infrared radiation emitted by the Earth, so the atmosphere warms up.
Possible effects: sea level rise from melting ice and thermal expansion, more extreme weather, changes to habitats and food production.
## Early atmosphere
The early atmosphere was mostly carbon dioxide from volcanoes, with water vapour that condensed to form oceans. Plants and algae removed CO~2~ and released oxygen by photosynthesis. Carbon became locked into sedimentary rocks, coal and oil.
!tip Remember: rusting needs both oxygen AND water. A test tube with dry air, or boiled water with oil on top, will not rust.`,

`## The reactivity series
**Potassium, sodium, lithium, calcium, magnesium, aluminium, (carbon), zinc, iron, (hydrogen), copper, silver, gold** (most to least reactive).
Reactivity is judged by:
- reaction with water (K, Na, Li, Ca react with cold water; Mg with steam)
- reaction with dilute acid (the more reactive the metal, the more vigorous the bubbling)
- displacement of metals from solutions of their salts
metal + acid → salt + hydrogen. metal + water → hydroxide + hydrogen.
## Displacement
A more reactive metal displaces a less reactive metal from its compound.
Zn + CuSO~4~ → ZnSO~4~ + Cu (blue solution fades, reddish-brown copper forms)
Ionic equation: Zn + Cu^2+^ → Zn^2+^ + Cu. Zinc is oxidised, copper ions are reduced.
## Extraction
Metals are found in ores as compounds. The method depends on position in the series:
| Metal | Method |
| Above carbon (K to Al) | Electrolysis of the molten compound |
| Below carbon (Zn, Fe, Cu) | Reduction by heating with carbon |
| Gold, silver | Found as the uncombined metal |
### Blast furnace (iron)
Raw materials: iron ore (haematite, Fe~2~O~3~), coke (carbon), limestone, hot air.
1. C + O~2~ → CO~2~ (heat)
2. CO~2~ + C → 2CO
3. Fe~2~O~3~ + 3CO → 2Fe + 3CO~2~
4. Limestone (CaCO~3~) → CaO + CO~2~; CaO + SiO~2~ → CaSiO~3~ (slag removes impurities)
### Aluminium
Aluminium oxide (from bauxite) is dissolved in molten **cryolite** to lower the melting point and save energy, then electrolysed. Aluminium forms at the cathode; oxygen at the carbon anode reacts with the anodes, which burn away and have to be replaced.
## Uses and recycling
- Aluminium: low density and resistant to corrosion, for aircraft and cans
- Copper: good conductor and malleable, for wires and pipes
- Steel: iron with carbon, strong, for construction
- Recycling saves energy, conserves ores and reduces landfill.
!tip Aluminium is protected by a thin layer of aluminium oxide on the surface, which is why it does not corrode despite being fairly reactive.`,

T("chem","c10","2","Acids, alkalis and making salts","pH, neutralisation, preparing soluble and insoluble salts, and titration.",2,

`## Acids and alkalis
!fig ph
Acids produce H^+^ ions in water; alkalis produce OH^−^ ions. Neutral is pH 7. Universal indicator is red in strong acid, green at pH 7 and purple in strong alkali. Litmus is red in acid and blue in alkali. Methyl orange is red in acid and yellow in alkali, phenolphthalein is colourless in acid and pink in alkali.
**Strong** acids (HCl, H~2~SO~4~, HNO~3~) ionise completely in water. **Weak** acids (ethanoic acid) only partly ionise.
## Reactions of acids
- acid + metal → salt + hydrogen
- acid + metal oxide / hydroxide (base) → salt + water
- acid + carbonate → salt + water + carbon dioxide
- acid + alkali → salt + water (neutralisation): H^+^ + OH^−^ → H~2~O
Salts: hydrochloric acid → chlorides; sulfuric acid → sulfates; nitric acid → nitrates.
## Preparing a soluble salt
1. Warm the acid and add excess insoluble base (metal, oxide or carbonate) until no more dissolves
2. **Filter** to remove the excess
3. Heat the filtrate gently to evaporate some water until saturated; leave to **crystallise**
4. Filter off crystals, wash with a little cold water and dry
Soluble salts of Group 1 or ammonium cannot be made this way since the bases are soluble. Use a **titration** to find the exact volumes, then repeat without the indicator.
## Precipitation
Mix two solutions to make an insoluble salt, then filter, wash with distilled water and dry.
Ag^+^(aq) + Cl^−^(aq) → AgCl(s)
## Solubility rules
All nitrates, all common sodium, potassium and ammonium salts are soluble. Most chlorides are soluble (not silver or lead). Most sulfates are soluble (not barium, lead, calcium). Most carbonates and hydroxides are insoluble (except Group 1).
## Titration
1. Pipette 25.0 cm^3^ of alkali into a conical flask; add indicator
2. Add acid from a burette until the colour just changes (the end point)
3. Record the titre. Repeat until two results are within 0.10 cm^3^ (concordant)
4. Use the mean of concordant titres
!eg 25.0 cm^3^ of NaOH needs 20.0 cm^3^ of 0.100 mol/dm^3^ HCl. Moles HCl = 0.100 × 0.0200 = 0.00200. Ratio 1:1, so moles NaOH = 0.00200. Concentration = 0.00200 ÷ 0.0250 = 0.0800 mol/dm^3^.
!mistake Convert cm^3^ to dm^3^ by dividing by 1000 before using concentration × volume.`,

T("chem","c12","3","Energetics","Exothermic and endothermic reactions, energy diagrams, bond energies and calorimetry.",3,
["Define exothermic and endothermic","Draw and label reaction profile diagrams","Calculate energy changes from bond energies","Use Q = mcΔT to find energy change","Describe the apparatus for measuring energy changes"],
`## Exothermic and endothermic
- **Exothermic**: releases energy to the surroundings, the temperature rises. Examples: combustion, neutralisation, respiration.
- **Endothermic**: takes in energy from the surroundings, the temperature falls. Examples: thermal decomposition, photosynthesis, dissolving ammonium nitrate.
## Reaction profiles
!fig energy
The **activation energy** is the minimum energy colliding particles need to react. In an exothermic reaction the products are at a lower energy than the reactants. In an endothermic reaction the products are at a higher energy. ΔH is negative for exothermic reactions and positive for endothermic ones.
## Bond energies
- **Breaking** bonds is endothermic (energy in)
- **Making** bonds is exothermic (energy out)
**ΔH = energy to break bonds − energy released making bonds**
!eg H~2~ + Cl~2~ → 2HCl. Bonds broken: H–H (436) + Cl–Cl (243) = 679 kJ/mol. Bonds made: 2 × H–Cl (432) = 864 kJ/mol. ΔH = 679 − 864 = −185 kJ/mol, so exothermic.
## Calorimetry
**Q = m × c × ΔT**
Q is energy in joules, m is mass of water in grams, c is the specific heat capacity of water (4.2 J/g/°C), and ΔT is the temperature change.
!eg 50 cm^3^ of water is heated by 10 °C by burning a fuel. Q = 50 × 4.2 × 10 = 2100 J.
For neutralisation, use a polystyrene cup and lid to reduce heat loss. For combustion, burn the fuel under a metal can of water. Heat loss, incomplete combustion and the metal can absorbing heat all make the result lower than the true value.
To find energy per mole: divide Q by moles of the reacting substance.
!tip In reaction profile diagrams, draw the arrow for ΔH from the reactant level to the product level, and the arrow for activation energy from the reactant level to the peak.`,

["Describe how rate can be measured","Explain the effect of concentration, temperature, surface area and catalysts using collision theory","Interpret rate graphs","Calculate mean rate","Describe energy profile for a catalysed reaction"],
`## Measuring rate
Rate = amount of reactant used or product formed ÷ time. Common methods:
- **Gas collection**: measure the volume of gas in a gas syringe against time
- **Mass loss**: a reaction that gives off gas on a balance
- **Colour / turbidity**: the "disappearing cross" with sodium thiosulfate and acid; time for the cross to vanish
## Collision theory
Particles must **collide** with enough energy (at least the activation energy) for a reaction to take place. Not every collision is successful. Increasing the frequency of successful collisions increases the rate.
| Factor | Effect | Explanation |
| Concentration (or pressure for gases) | Rate increases | More particles per volume, so more frequent collisions |
| Temperature | Rate increases | Particles move faster, collide more often **and** with more energy; a bigger fraction exceeds the activation energy |
| Surface area (smaller pieces) | Rate increases | More particles exposed to collisions |
| Catalyst | Rate increases | Provides an alternative pathway with lower activation energy |
!fig rate
## Catalysts
A **catalyst** speeds up a reaction without being used up and does not change the products. Examples: manganese(IV) oxide for hydrogen peroxide decomposition, iron in the Haber process, enzymes. Industry uses catalysts to save energy and cost.
## Reading rate graphs
The steepest part of a graph of volume against time is the fastest rate. The curve levels off when the reaction has finished. The mean rate = total volume ÷ total time. The rate at a particular time is the gradient of the tangent.
!eg 48 cm^3^ of gas is made in 120 s. Mean rate = 48 ÷ 120 = 0.40 cm^3^/s.
## Core practical: marble chips and acid
React calcium carbonate chips with hydrochloric acid and measure the volume of CO~2~ or mass lost over time. Repeat with different concentrations or powdered marble. Keep acid volume, mass of marble and temperature constant.
!tip The temperature answer needs two ideas: more frequent collisions AND more of them have energy greater than the activation energy.`,

`## Reversible reactions
Some reactions go both ways, shown by ⇌.
hydrated copper(II) sulfate (blue) ⇌ anhydrous copper(II) sulfate (white) + water
Ammonium chloride ⇌ ammonia + hydrogen chloride (on heating and cooling)
## Dynamic equilibrium
In a closed system a reversible reaction reaches **equilibrium** when the rate of the forward reaction equals the rate of the reverse reaction. The concentrations of reactants and products stay constant, but both reactions are still happening.
## Le Chatelier's principle
If a change is made to a system at equilibrium, the position shifts to oppose the change.
| Change | Effect on position |
| Increase concentration of reactant | Shifts to products |
| Increase pressure | Shifts to the side with fewer gas molecules |
| Increase temperature | Shifts in the endothermic direction |
| Decrease temperature | Shifts in the exothermic direction |
| Catalyst | No change in position; reaches equilibrium faster |
## The Haber process
N~2~(g) + 3H~2~(g) ⇌ 2NH~3~(g) (forward reaction exothermic)
- Nitrogen from the air, hydrogen from natural gas (methane)
- **Conditions**: about 450 °C, 200 atmospheres, iron catalyst
- The ammonia is cooled and liquefied and removed, and unreacted nitrogen and hydrogen are recycled
**Why these conditions?** High pressure favours the side with fewer molecules (2 vs 4), increasing the yield, but it is expensive and dangerous. A lower temperature favours the exothermic direction and gives a higher yield, but is too slow, so 450 °C is a compromise between yield and rate.
## Uses
Most ammonia is used to make **fertilisers** such as ammonium nitrate and ammonium sulfate. Nitric acid is also made from ammonia. NPK fertilisers contain nitrogen, phosphorus and potassium.
!tip Always compare number of moles of gas on each side to answer pressure questions. If both sides are equal, pressure has no effect.`,

["Describe how crude oil is separated into fractions","Explain how properties change with chain length","Describe complete and incomplete combustion","Describe cracking and why it is done","Write the formulae of alkanes and draw their structures"],
`## Crude oil
Crude oil is a mixture of hydrocarbons formed from the remains of ancient marine organisms over millions of years. A **hydrocarbon** contains only hydrogen and carbon.
## Fractional distillation
The oil is heated and vapours rise up a fractionating column which is hot at the bottom and cooler at the top. Each **fraction** condenses at the height where the temperature is just below its boiling point.
| Fraction | Chain length | Use |
| Refinery gases | 1–4 C | Bottled gas, heating |
| Petrol (gasoline) | 5–10 C | Car fuel |
| Naphtha | 7–14 C | Making chemicals |
| Kerosene | 10–16 C | Jet fuel |
| Diesel | 14–20 C | Lorries, trains |
| Fuel oil | 20–50 C | Ships, heating |
| Bitumen | 50+ C | Roads |
As chain length increases: boiling point goes up, viscosity goes up (thicker), flammability goes down, and the colour darkens.
## Alkanes
Alkanes are **saturated** hydrocarbons (only single C–C bonds), with the general formula **C~n~H~2n+2~**.
| Name | Formula |
| Methane | CH~4~ |
| Ethane | C~2~H~6~ |
| Propane | C~3~H~8~ |
| Butane | C~4~H~10~ |
They belong to a **homologous series**: same general formula, similar chemical properties, gradual change in physical properties, and each member differs by CH~2~. Butane has two **isomers** with the same molecular formula but different structures: butane and 2-methylpropane.
## Combustion
Complete (plenty of oxygen): hydrocarbon + oxygen → carbon dioxide + water. CH~4~ + 2O~2~ → CO~2~ + 2H~2~O.
Incomplete (limited oxygen): carbon monoxide and/or carbon (soot) + water. Carbon monoxide is toxic: it stops haemoglobin carrying oxygen.
Burning fuels containing sulfur makes SO~2~, which causes acid rain. High temperature engines produce nitrogen oxides, which also cause acid rain and respiratory problems. Catalytic converters change CO and NO~x~ into CO~2~ and N~2~.
## Cracking
**Cracking** breaks large hydrocarbons into smaller, more useful ones, since demand for petrol is higher than the supply of long chains. It uses a hot catalyst (e.g. aluminium oxide) or steam at high temperature. Products are a shorter alkane and an alkene.
C~10~H~22~ → C~8~H~18~ + C~2~H~4~
!tip When asked about a trend in fractions, always link it to the size of the molecules and strength of intermolecular forces.`,

`## Alkenes
Alkenes are **unsaturated** hydrocarbons containing a carbon–carbon double bond. General formula **C~n~H~2n~**. Ethene is C~2~H~4~, propene is C~3~H~6~, butene is C~4~H~8~. They are more reactive than alkanes because of the double bond.
## Test for unsaturation
Shake with **bromine water** (orange). An alkene decolourises it quickly (orange → colourless). An alkane has no effect.
## Addition reactions
The double bond opens up and atoms add on.
- With hydrogen (nickel catalyst, 150 °C): alkene → alkane. C~2~H~4~ + H~2~ → C~2~H~6~
- With bromine: C~2~H~4~ + Br~2~ → C~2~H~4~Br~2~ (1,2-dibromoethane)
- With steam (phosphoric acid catalyst, high temperature and pressure): C~2~H~4~ + H~2~O → C~2~H~5~OH (ethanol)
## Addition polymerisation
Many small alkene molecules (**monomers**) join to form a long chain (**polymer**), with no other product. The double bond opens.
n CH~2~=CH~2~ → –(CH~2~–CH~2~)~n~–
Draw the **repeat unit** with the bonds extending through the brackets, and no double bond remaining.
| Polymer | Monomer | Use |
| Poly(ethene) | Ethene | Carrier bags, bottles |
| Poly(propene) | Propene | Ropes, crates |
| Poly(chloroethene) PVC | Chloroethene | Pipes, window frames |
| Poly(tetrafluoroethene) PTFE | Tetrafluoroethene | Non-stick coatings |
## Condensation polymers
Nylon and polyesters are made from two different monomers that join and lose a small molecule (water) each time a link forms.
## Disposal of polymers
Most addition polymers are **not biodegradable** since microorganisms cannot break the strong carbon chains. Problems: landfill space, pollution of land and oceans, harm to wildlife. Burning produces carbon dioxide and toxic gases (hydrogen chloride from PVC). Alternatives: recycling, biodegradable plastics, reducing use.
!mistake A polymer's repeat unit has no C=C. Students lose marks by leaving the double bond in. Check each carbon has four single bonds.`,

["Compare fermentation and hydration for making ethanol","Describe the properties and uses of ethanol","Describe the oxidation of ethanol","Describe properties and reactions of carboxylic acids","Describe the formation of esters"],
`## Alcohols
The alcohols are a homologous series with the **–OH** functional group: methanol CH~3~OH, ethanol C~2~H~5~OH, propanol C~3~H~7~OH. They burn in air: C~2~H~5~OH + 3O~2~ → 2CO~2~ + 3H~2~O. Ethanol is used as a solvent, a fuel, and in drinks.
## Making ethanol
| | Fermentation | Hydration of ethene |
| Reactants | Sugar solution (glucose) | Ethene and steam |
| Conditions | Yeast, about 30 °C, no oxygen | Phosphoric acid catalyst, 300 °C, 60–70 atm |
| Speed | Slow (days) | Fast |
| Product | Dilute ethanol; needs distillation | Pure ethanol |
| Raw material | Renewable (plants) | Non-renewable (crude oil) |
| Type | Batch process | Continuous process |
C~6~H~12~O~6~ → 2C~2~H~5~OH + 2CO~2~
## Oxidation
Ethanol is oxidised by acidified potassium dichromate(VI) (orange to green) on heating to **ethanoic acid**. Left in the air, wine oxidises as microbes convert ethanol to ethanoic acid, which is why it turns sour.
## Carboxylic acids
Functional group **–COOH**: methanoic acid (HCOOH), ethanoic acid (CH~3~COOH), propanoic acid (C~2~H~5~COOH). They are **weak acids**: partly ionised in water, pH about 3 to 5. They react as typical acids:
- with metals: 2CH~3~COOH + Mg → (CH~3~COO)~2~Mg + H~2~
- with carbonates: fizzing, CO~2~ given off
- with alkalis: neutralisation to give a salt (ethanoate)
## Esters
An alcohol and a carboxylic acid react, with a few drops of concentrated sulfuric acid catalyst and heat, to form an **ester** and water.
ethanol + ethanoic acid ⇌ ethyl ethanoate + water
Esters have sweet, fruity smells and are used as flavourings, perfumes and solvents. The ester name comes from the alcohol (first part, "ethyl") then the acid ("ethanoate").
!tip Naming an ester: alcohol gives the first word, acid gives the second. Methanol + propanoic acid gives methyl propanoate.`,
