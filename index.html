["Use grid references, scale and bearings on maps","Calculate gradient and draw cross-sections","Choose and complete suitable graphs and maps","Calculate and interpret statistics including Spearman's rank","Plan, carry out and evaluate a fieldwork investigation"],
`## Map skills
- **Four-figure grid reference**: give eastings (along) first, then northings (up), e.g. 4376. It names a square.
- **Six-figure grid reference**: estimate tenths within the square to name a point.
- **Scale**: 1:50 000 means 1 cm on the map = 50 000 cm = 500 m on the ground (so 2 cm = 1 km). Use string for curved routes.
- **Bearings**: measured clockwise from north, three figures (e.g. 045°).
- **Contour lines** join places of equal height. Close together means steep; far apart means gentle. Concentric rings suggest a hill; V-shapes point uphill in valleys.
- **Gradient = vertical difference ÷ horizontal distance** (e.g. 50 m rise over 1000 m = 1 in 20).
- **Cross-section**: lay a strip of paper along the line, mark heights at each contour, plot against a distance scale.
## Describing a map
Name features, give grid references, and use compass directions. Settlement patterns, relief, drainage, and land use are the main things to comment on.
## Graphs
| Type | Best for |
| Bar graph | Comparing categories |
| Histogram | Continuous data (frequency in classes) |
| Line graph | Change over time |
| Pie chart | Proportions of a whole |
| Scatter graph | Relationship between two variables (with a line of best fit) |
| Divided bar / triangular graph | Percentages in components |
| Choropleth map | Data by area using shades |
| Flow-line map | Movement, with width showing quantity |
| Isoline map | Lines joining equal values |
## Statistics
Mean, median, mode, range, interquartile range, and percentage change.
**Spearman's rank correlation** tests the strength of a relationship between two sets of data: rank both sets, find d (difference in ranks), then r~s~ = 1 − (6 × Σd^2^) ÷ (n^3^ − n). Results close to +1 show strong positive correlation, close to −1 strong negative, close to 0 none. Compare with a table of critical values for significance.
## The enquiry process
1. **Question or hypothesis**: e.g. "Velocity increases downstream"
2. **Method**: what, where and how to collect data. **Primary data** is collected yourself; **secondary** from other sources
3. **Sampling**: random, systematic (at regular intervals) or stratified; sample size must be large enough
4. **Risk assessment** and reducing risk
5. **Presentation**: graphs, maps, photos, annotated sketches
6. **Analysis and conclusion**: describe patterns, give evidence, explain with theory, and say if hypothesis was supported
7. **Evaluation**: problems (limited sample, human error, weather, anomalies), reliability, and improvements
!tip In Paper 4 evaluation questions, name the limitation specifically and give a way to improve it, e.g. "Only 5 sites; take 10 sites to be more reliable".`,

if(!sc||!C||C.sc!==sc){C=null;if(!sc){return '<h1>Flashcards</h1><p class="mut">Spaced repetition: cards you know come back less often, cards you miss come back sooner.</p><div class="sheet row"><a class="btn" href="#/cards/all">All subjects ('+dueCards().length+' ready)</a>'+subs.map(k=>'<a class="btn alt" href="#/cards/'+k+'">'+SUBJ[k].n+' ('+dueCards(k).length+')</a>').join('')+'</div><p class="mut">To study one topic, open it and choose Key terms.</p>'}
const l=dueCards(sc).sort(()=>Math.random()-.5).slice(0,20);C={sc,l,i:0,f:false,n:l.length,ok:0}}
if(C.i>=C.l.length)return '<h1>Session done</h1><p>'+(C.n?C.ok+' of '+C.n+' recalled well.':'Nothing is due here right now. Come back tomorrow or try another deck.')+'</p><a class="btn" href="#/cards">Back to decks</a>';
const k=C.l[C.i],[tid,ix]=k.split(':'),t=tp(tid),x=t.terms[ix];
return '<div class="mut">Card '+(C.i+1)+' of '+C.l.length+' · '+t.title+'</div><div class="sheet flash" data-a="flip" style="border-color:var(--'+t.subj+')">'+(C.f?fmt(x[1]):fmt(x[0]))+'</div>'+(C.f?'<div class="row"><button class="btn alt" data-a="rate" data-v="0">1 Again</button><button class="btn alt" data-a="rate" data-v="1">2 Hard</button><button class="btn alt" data-a="rate" data-v="2">3 Good</button><button class="btn alt" data-a="rate" data-v="3">4 Easy</button></div>':'<button class="btn" data-a="flip">Show answer (space)</button>')};
function pool(sc,ty){let l=sc==='all'?TOPICS:sc.startsWith('subj:')?bySub(sc.slice(5)):[tp(sc.slice(6))];const a=[];l.forEach(t=>t.qs.forEach((q,i)=>{if(ty==='mcq'&&q[0]!=='m'||ty==='str'&&q[0]!=='s')return;a.push({id:t.id+'#'+i,t,q})}));return a}
V.quiz=()=>{if(Q)return qView();return '<h1>Practice</h1><div class="sheet"><p><b>What do you want to practise?</b></p><div class="row"><select data-f="scope"><option value="all">All subjects</option>'+Object.keys(SUBJ).map(k=>'<optgroup label="'+SUBJ[k].n+'"><option value="subj:'+k+'">All of '+SUBJ[k].n+'</option>'+bySub(k).map(t=>'<option value="topic:'+t.id+'">'+t.code+' '+t.title+'</option>').join('')+'</optgroup>').join('')+'</select><select data-f="type"><option value="mix">Mixed</option><option value="mcq">Multiple choice</option><option value="str">Written answers</option></select><select data-f="n"><option>5</option><option selected>10</option><option>20</option></select></div><p><button class="btn" data-a="start">Start</button></p></div><p class="mut">Written answers are marked by you against the mark points, like marking a past paper.</p>'};
function qView(){if(Q.i>=Q.l.length){const m=Q.l.reduce((a,x)=>a+x.mk,0),tot=Q.l.reduce((a,x)=>a+x.max,0),miss=Q.l.filter(x=>x.mk<x.max);return '<h1>'+m+' / '+tot+' marks</h1><div class="bar" style="--c:var(--ok)"><i style="width:'+pct(m/tot)+'"></i></div>'+(miss.length?'<h3>Worth another look</h3><ul>'+[...new Set(miss.map(x=>x.t.id))].map(i=>'<li><a href="#/t/'+i+'">'+tp(i).title+'</a></li>').join('')+'</ul>':'<p>Full marks. Nice.</p>')+'<p><button class="btn" data-a="again">Another set</button> <a class="btn alt" href="#/progress">Progress</a></p>'}
const x=Q.l[Q.i],q=x.q,s=x.t.subj;let h='<div class="mut">Question '+(Q.i+1)+' of '+Q.l.length+' · '+x.t.title+' · '+x.max+' mark'+(x.max>1?'s':'')+'</div><div class="bar" style="--c:var(--'+s+')"><i style="width:'+pct(Q.i/Q.l.length)+'"></i></div><div class="sheet"><b>'+fmt(q[1])+'</b></div>';
if(q[0]==='m'){h+=q[2].map((o,i)=>'<button class="opt '+(x.fb?(i===q[3]?'right':x.sel===i?'wrong':''):'')+'" data-a="pick" data-i="'+i+'" '+(x.fb?'disabled':'')+'>'+'ABCD'[i]+'. '+fmt(o)+'</button>').join('');if(x.fb)h+='<div class="co eg"><b class="t">'+(x.sel===q[3]?'Correct':'Not quite')+'</b><br>'+fmt(q[4])+'</div><button class="btn" data-a="next">Next</button>'}
else{if(!x.fb)h+='<textarea id="ans" placeholder="Write your answer here">'+esc(x.txt||'')+'</textarea><p><button class="btn" data-a="reveal">Show mark scheme</button></p>';
else h+='<div class="sheet" style="background:var(--tint)"><small class="mut">Your answer</small><br>'+esc(x.txt||'(blank)')+'</div><p><b>Tick each mark point you made:</b></p>'+q[3].map((p,i)=>'<label class="sheet row" style="margin:6px 0;cursor:pointer"><input type="checkbox" data-a="tick" data-i="'+i+'" '+(x.ticks[i]?'checked':'')+'> <span>'+fmt(p)+'</span></label>').join('')+'<p><b>'+x.ticks.filter(Boolean).length+' / '+x.max+'</b> <button class="btn" data-a="next">Next</button></p>'}
return h}
V.progress=()=>'<h1>Progress</h1>'+Object.keys(SUBJ).map(k=>'<div class="sheet" style="--c:var(--'+k+')"><div class="row" style="justify-content:space-between"><h3 style="margin:0;color:var(--'+k+')">'+SUBJ[k].n+'</h3><b>'+pct(subPct(k))+'</b></div><div class="bar"><i style="width:'+pct(subPct(k))+'"></i></div><div class="wrap"><table class="tbl"><tr><th>Topic</th><th>Confidence</th><th>Checklist</th><th>Questions</th></tr>'+bySub(k).map(t=>{const a=acc(t);return '<tr><td><a href="#/t/'+t.id+'">'+t.title+'</a></td><td><span class="dot d'+(S.conf[t.id]||0)+'" style="display:inline-block"></span></td><td>'+sd(t)+'/'+t.spec.length+'</td><td>'+(a===null?'–':pct(a))+'</td></tr>'}).join('')+'</table></div></div>').join('')+'<p class="mut">Questions answered in sessions: '+S.hist.length+'. Progress is stored in this browser only.</p><button class="btn alt" data-a="reset">Reset all progress</button>';
V.glossary=()=>{const q=GQ.toLowerCase(),r=[];TOPICS.forEach(t=>t.terms.forEach(x=>{if(!q||(x[0]+' '+x[1]).toLowerCase().includes(q))r.push([x,t])}));r.sort((a,b)=>a[0][0].localeCompare(b[0][0]));
return '<h1>Glossary</h1><input type="text" id="gq" placeholder="Search terms and definitions" value="'+esc(GQ)+'" style="width:100%;max-width:420px"><p class="mut">'+r.length+' terms</p><div class="wrap"><table>'+r.slice(0,150).map(([x,t])=>'<tr><td><b>'+fmt(x[0])+'</b></td><td>'+fmt(x[1])+'</td><td><a href="#/t/'+t.id+'" style="color:var(--'+t.subj+')">'+SUBJ[t.subj].n+'</a></td></tr>').join('')+'</table></div>'};
V.guide=()=>'<h1>Exam skills</h1><h3>Command words</h3><div class="wrap"><table>'+CMD.map(c=>'<tr><td><b>'+c[0]+'</b></td><td>'+c[1]+'</td></tr>').join('')+'</table></div><h3>Mark scheme habits</h3><ul><li>The number of marks tells you roughly how many separate points to make.</li><li>Use the exact scientific or geographical term, not an everyday one.</li><li>On calculations, working earns marks even when the final answer is wrong.</li><li>Leave time to read your answers back, especially units and signs.</li></ul>';
function render(){nav();const [p,a]=(location.hash||'#/').slice(2).split('/');if(p!=='quiz'&&Q&&Q.i>=Q.l.length)Q=null;
E.innerHTML=p==='s'?V.s(a):p==='t'?V.t(a):p==='cards'?V.cards(a):p==='quiz'?V.quiz():p==='progress'?V.progress():p==='glossary'?V.glossary():p==='guide'?V.guide():V.home()}
let lastH='';window.addEventListener('hashchange',()=>{TAB='notes';SUBTAB='topics';render();scrollTo(0,0)});
const A={theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.theme=cur==='dark'?'light':'dark';d.dataset.theme=S.theme;save()},
subtab(d){SUBTAB=d.v;render()},tab(d){TAB=d.v;render()},conf(d){S.conf[d.id]=+d.v;save();render()},
spec(d,el){const a=S.spec[d.id]||[];a[+d.i]=el.checked;S.spec[d.id]=a;save()},note(d,el){S.notes[d.id]=el.value;save()},
flip(){C.f=true;render()},rate(d){const k=C.l[C.i],c=S.cards[k]||{b:0},v=+d.v;c.b=v===0?0:Math.min(5,c.b+(v===3?2:v===2?1:0));c.d=day()+[0,1,2,4,8,16][c.b]+(v===0?0:0);if(v===0)c.d=day();S.cards[k]=c;if(v>=2)C.ok++;if(v===0)C.l.push(k);C.i++;C.f=false;save();render()},
qs(d){QB.scope=d.v},start(){const p=pool(QB.scope,QB.type).sort(()=>Math.random()-.5).slice(0,+QB.n);if(!p.length)return;Q={l:p.map(x=>({...x,max:x.q[0]==='m'?1:x.q[2],mk:0,ticks:[]})),i:0};render()},
pick(d){const x=Q.l[Q.i];x.sel=+d.i;x.fb=true;x.mk=x.sel===x.q[3]?1:0;render()},reveal(){const x=Q.l[Q.i];x.txt=$('#ans').value;x.fb=true;render()},
tick(d,el){const x=Q.l[Q.i];x.ticks[+d.i]=el.checked;x.mk=Math.min(x.max,x.ticks.filter(Boolean).length);render()},
next(){const x=Q.l[Q.i];S.qs[x.id]=x.mk>=x.max?'c':'w';S.hist.push({t:Date.now(),id:x.id,mk:x.mk});if(S.hist.length>500)S.hist.shift();Q.i++;save();render();scrollTo(0,0)},
again(){Q=null;render()},reset(){if(confirm('Delete all saved progress on this device?')){S={conf:{},spec:{},cards:{},qs:{},hist:[],notes:{},theme:S.theme};save();render()}}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;A[el.dataset.a]&&A[el.dataset.a](el.dataset,el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el.dataset,el);if(el.dataset.f)QB[el.dataset.f]=el.value});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.a==='note')A.note(el.dataset,el);if(el.id==='gq'){GQ=el.value;const p=el.selectionStart;render();const n=$('#gq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(!C||!location.hash.startsWith('#/cards/')||C.i>=C.l.length||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key===' '&&!C.f){e.preventDefault();A.flip()}else if(C.f&&'1234'.includes(e.key)){A.rate({v:+e.key-1})}});
render();
</script></body></html>
